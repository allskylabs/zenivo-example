# Example nginx reverse proxy for Zenivo. Copy to /etc/nginx/sites-available/zenivo, edit
# server_name and the upstream port, then:
#   sudo ln -s /etc/nginx/sites-available/zenivo /etc/nginx/sites-enabled/zenivo
#   sudo nginx -t && sudo systemctl reload nginx
# Zenivo has no authentication. Bind it to 127.0.0.1 (--host 127.0.0.1) and put access control,
# TLS or a tunnel in front of this server block.
server {
    listen 80;
    server_name zenivo.example.com;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;     # the --port of the Zenivo service
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # set to https when TLS ends in front of nginx
        # WebSocket (/ws/live)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        # MJPEG (/api/stream/mjpeg) and SSE (/api/stream/sse) are long-lived streams: do not buffer
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zenivo"
dynamic = ["version"]
description = "Zenivo — all-sky observatory software (capture, calibration, live view, sky events)"
authors = [{ name = "Zenivo" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "Pillow>=11.3.0",
    "pillow-avif-plugin>=1.5.0",
    "urllib3>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.dynamic]
version = {attr = "src.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

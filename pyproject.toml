[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zenivo"
dynamic = ["version"]
description = "Zenivo — all-sky observatory software (capture, calibration, live view, sky events)"
authors = [{ name = "Zenivo" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
classifiers = ["License :: OSI Approved :: MIT License"]
dependencies = [
    "numpy>=1.24.0",
    "Pillow>=11.3.0",
    "cryptography>=38",
    "pillow-avif-plugin>=1.5.0",
    "urllib3>=1.26",
    "sgp4>=2.23",
    "fastapi",
    "uvicorn",
    "websockets",
    "opencv-python-headless",
    "requests",
    "httpx",
]

[project.optional-dependencies]
zwo = ["zwoasi>=0.1.0"]   # ZWO ASI cameras; also needs ZWO libASICamera2 (see docs/INSTALL.md)
test = [
    "pytest>=7.0.0",
]

[tool.setuptools.dynamic]
version = {attr = "src.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["src/web", "data"]

[tool.ruff.lint]
# Real mistakes only (pyflakes): unused imports/variables, undefined names. No style rules.
select = ["F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

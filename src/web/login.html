<body class="login-page">
    <main class="login-card card" aria-labelledby="login-title">
        <div class="login-brand">
            <!-- brand:start (generated by scripts/sync_nav.py) -->
            <svg class="brand-mark" width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><path class="bm-ring" d="M36.2 6.35A26 26 0 1 1 27.8 6.35" fill="none" stroke-width="6"/><path class="bm-tick" d="M32 4.6V9.6" fill="none" stroke-width="2.2" stroke-linecap="round"/><circle class="bm-inner" cx="32" cy="32" r="18.5" fill="none" stroke-width="3.5"/><polygon class="bm-star" points="38.00,23.80 38.85,25.84 41.04,26.01 39.37,27.44 39.88,29.59 38.00,28.44 36.12,29.59 36.63,27.44 34.96,26.01 37.15,25.84"/></svg>
            <h1 class="brand-name">Zenivo</h1>
            <!-- brand:end -->
        </div>
        <h2 id="login-title">Sign in</h2>
        <p class="field-note" id="login-lead">Enter the admin password to change settings.</p>

        <form id="login-form" autocomplete="on" novalidate>
            <input type="text" name="username" value="admin" autocomplete="username" hidden readonly aria-hidden="true" tabindex="-1">
            <div class="field" id="field-code" hidden>
                <label for="login-code">Setup code</label>
                <input type="text" id="login-code" name="setup-code" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="100">
                <p class="field-note">First start: the code is in <code>data/admin_setup_code.txt</code> on the station
                    (<code>cat data/admin_setup_code.txt</code>).</p>
            </div>
            <div class="field">
                <label for="login-password" id="login-password-label">Password</label>
                <input type="password" id="login-password" name="password" autocomplete="current-password" maxlength="256" required>
            </div>
            <div class="field" id="field-repeat" hidden>
                <label for="login-repeat">Repeat password</label>
                <input type="password" id="login-repeat" name="password-repeat" autocomplete="new-password" maxlength="256">
            </div>
            <div class="alert-box alert-error hidden" id="login-error" role="alert"></div>
            <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
        </form>
        <p class="field-note"><a href="/live" style="color: var(--accent)">Continue as guest</a></p>
    </main>
    <script src="/static/login.js?v=1"></script>
</body>
</html>

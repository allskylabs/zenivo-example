        <div class="lg-brand">

            <svg class="brand-mark" width="28" height="28" viewBox="0 0 64 64" aria-hidden="true"><path class="bm-ring" d="M36.2 6.35A26 26 0 1 1 27.8 6.35" fill="none" stroke-width="6"/><path class="bm-tick" d="M32 4.6V9.6" fill="none" stroke-width="2.2" stroke-linecap="round"/><circle class="bm-inner" cx="32" cy="32" r="18.5" fill="none" stroke-width="3.5"/><polygon class="bm-star" points="38.00,23.80 38.85,25.84 41.04,26.01 39.37,27.44 39.88,29.59 38.00,28.44 36.12,29.59 36.63,27.44 34.96,26.01 37.15,25.84"/></svg>

            <div class="lg-field" id="field-code" hidden>
                <label class="lg-label" for="login-code"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-key-round"></use></svg><span>Setup code</span>
                    <button type="button" class="ds-btn ds-btn--ghost ds-btn--icon" id="lg-info" aria-label="Where is the setup code?" aria-expanded="false" aria-controls="lg-hint"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-info"></use></svg></button></label>
                <input class="lg-input" type="text" id="login-code" name="setup-code" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="100">

            <div class="lg-field">

            <div class="lg-field" id="field-repeat" hidden>
                <label class="lg-label" for="login-repeat"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-lock"></use></svg><span>Repeat password</span></label>
                <input class="lg-input" type="password" id="login-repeat" name="password-repeat" autocomplete="new-password" maxlength="256">
            </div>
            <div class="lg-error" id="login-error" role="alert" hidden><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-triangle-alert"></use></svg><span id="login-error-text"></span></div>
            <button type="submit" class="ds-btn ds-btn--primary lg-submit" id="login-submit"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-log-in"></use></svg><span id="login-submit-text">Sign in</span></button>

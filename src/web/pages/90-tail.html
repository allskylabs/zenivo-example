    <script>
    // Settings sub-navigation: one section at a time, driven by the URL hash (/settings#detection)
    (function () {
        var sec = document.getElementById("tab-settings");
        var subs = ["home", "image", "detection", "station", "skymask", "integrations", "community", "admin"];
        function apply() {
            var h = (location.hash || "").replace("#", "");
            var sub = subs.indexOf(h) > 0 ? h : (window.matchMedia("(max-width: 768px)").matches && location.pathname === "/settings" ? "home" : "image");
            sec.setAttribute("data-sub", sub);
            if (sub === "skymask") window.dispatchEvent(new Event("resize"));
        }
        window.addEventListener("hashchange", apply);
        window.matchMedia("(max-width: 768px)").addEventListener("change", function () { if (!location.hash) apply(); });
        apply();
    })();
    </script>

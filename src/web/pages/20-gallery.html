        <!-- TAB 2: Archive (Products / By day / Events). Markup in src/web/pages/20-gallery.html, logic in app/08-gallery-adsb.js + app/08b-events-live.js, styles css/archive.css -->
        <section id="tab-gallery" class="tab-content">
            <div class="arc" id="gallery-container" data-gmode="products">
                <header class="arc-bar">
                    <div class="arc-segs" id="gallery-tabs" role="tablist" aria-label="Archive view">
                        <button type="button" class="arc-seg" data-gmode="products" role="tab" aria-selected="true" aria-label="Products" title="Products"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-layout-grid"></use></svg><span class="arc-seg__t">Products</span></button>
                        <button type="button" class="arc-seg" data-gmode="day" role="tab" aria-selected="false" aria-label="By day" title="By day"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-calendar-days"></use></svg><span class="arc-seg__t">By day</span></button>
                        <button type="button" class="arc-seg" data-gmode="events" role="tab" aria-selected="false" aria-label="Events" title="Events"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-telescope"></use></svg><span class="arc-seg__t">Events</span></button>
                    </div>
                    <div class="arc-tools">
                        <button type="button" class="ds-btn ds-btn--ghost ds-btn--icon" id="btn-arc-range" aria-label="Date range" aria-expanded="false" aria-controls="arc-range" title="Date range"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-calendar-days"></use></svg></button>
                        <button type="button" class="ds-btn ds-btn--ghost ds-btn--icon" id="btn-arc-seen" aria-label="Mark all events seen" title="Mark all events seen"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-check-check"></use></svg></button>
                        <button type="button" class="ds-btn ds-btn--ghost ds-btn--icon" id="btn-arc-refresh" aria-label="Refresh" title="Refresh"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-refresh-cw"></use></svg></button>
                        <button type="button" class="ds-btn ds-btn--ghost ds-btn--icon" id="btn-build-timelapse" data-admin aria-label="Build timelapse" title="Build timelapse" data-ds-open="timelapse-sheet"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-film"></use></svg></button>
                    </div>
                </header>
                <div class="arc-range" id="arc-range" hidden>
                    <label class="arc-date"><span class="sr-only">From</span><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-calendar-days"></use></svg><input type="date" id="arc-from" aria-label="From date"></label>
                    <span class="arc-range__sep" aria-hidden="true">&ndash;</span>
                    <label class="arc-date"><span class="sr-only">To</span><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-calendar-days"></use></svg><input type="date" id="arc-to" aria-label="To date"></label>
                    <button type="button" class="ds-btn ds-btn--ghost ds-btn--icon" id="arc-range-clear" aria-label="Clear date range" title="Clear date range"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-rotate-ccw"></use></svg></button>
                </div>

                <!-- Products: latest timelapse / keogram / startrails -->
                <div class="arc-pane" id="pane-products">
                    <div class="arc-meta"><span class="ds-chip" id="gallery-date" title="Night"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-moon-star"></use></svg><span id="gallery-date-t">--</span></span><span class="ds-chip" title="Archived frames"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-image"></use></svg><span id="gallery-frame-count">--</span></span></div>
                    <div id="gallery-alert" class="arc-alert" role="status" hidden></div>
                    <div id="products-grid" class="arc-grid"></div>
                </div>

                <!-- By day: one card per archived night -->
                <div class="arc-pane" id="pane-day" hidden>
                    <div id="day-list" class="arc-days"></div>
                </div>

                <!-- Events: chips + two-pane list/detail -->
                <div class="arc-pane" id="pane-events" hidden>
                    <div class="arc-chips" id="events-filter" role="group" aria-label="Event type"><button type="button" class="ds-chip arc-chip" data-type="" aria-pressed="true" aria-label="All" title="All"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-layers"></use></svg><b data-count="all">0</b></button><button type="button" class="ds-chip arc-chip" data-type="plane" aria-pressed="false" aria-label="Aircraft" title="Aircraft"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-plane"></use></svg><b data-count="plane">0</b></button><button type="button" class="ds-chip arc-chip" data-type="meteor" aria-pressed="false" aria-label="Meteors" title="Meteors"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-sparkles"></use></svg><b data-count="meteor">0</b></button><button type="button" class="ds-chip arc-chip" data-type="satellite" aria-pressed="false" aria-label="Satellites" title="Satellites"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-satellite"></use></svg><b data-count="satellite">0</b></button><button type="button" class="ds-chip arc-chip" data-type="clouds" aria-pressed="false" aria-label="Clouds" title="Clouds"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-cloud"></use></svg><b data-count="clouds">0</b></button><button type="button" class="ds-chip arc-chip" data-type="flash" aria-pressed="false" aria-label="Flashes" title="Flashes"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-zap"></use></svg><b data-count="flash">0</b></button>
                        <span class="arc-info" id="arc-total" title="Events shown / stored"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-info"></use></svg><b id="day-count-badge">0</b></span>
                    </div>
                    <div class="arc-split">
                        <div class="arc-list" id="arc-list" aria-live="polite"></div>
                        <aside class="arc-dock" id="arc-dock" aria-label="Event detail"></aside>
                    </div>
                    <div class="arc-more" id="arc-more" hidden><button type="button" class="ds-btn" id="btn-arc-more" aria-label="Load more" title="Load more"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-chevron-down"></use></svg></button></div>
                </div>
            </div>

            <!-- Timelapse builder (admin) -->
            <div class="ds-sheet" id="timelapse-sheet" role="dialog" aria-modal="true" aria-labelledby="tl-title" data-admin>
                <div class="ds-sheet__scrim" data-ds-close></div>
                <div class="ds-sheet__panel">
                    <div class="ds-sheet__grab" aria-hidden="true"></div>
                    <div class="ds-sheet__head"><h2 class="ds-sheet__title" id="tl-title">Timelapse</h2><button type="button" class="ds-btn ds-btn--ghost ds-btn--icon" data-ds-close aria-label="Close" title="Close"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-x"></use></svg></button></div>
                    <div class="arc-form">
                        <label class="arc-field"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-calendar-days"></use></svg><input type="date" id="tl-from" aria-label="From date"></label>
                        <label class="arc-field"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-calendar-days"></use></svg><input type="date" id="tl-to" aria-label="To date"></label>
                        <label class="arc-field"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-film"></use></svg><select id="tl-fps" aria-label="Frames per second"><option value="12">12 fps</option><option value="24" selected>24 fps</option><option value="30">30 fps</option></select></label>
                        <label class="arc-field"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-maximize"></use></svg><select id="tl-res" aria-label="Resolution"><option value="0">Full</option><option value="1280">1280</option><option value="960">960</option><option value="640">640</option></select></label>
                        <label class="arc-field arc-field--chk"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-type"></use></svg><input type="checkbox" id="tl-overlay" checked aria-label="Overlay text"></label>

                    </div>
                    <button type="button" class="ds-btn ds-btn--primary" id="tl-build" aria-label="Build timelapse" title="Build timelapse"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-play"></use></svg></button>
                    <div id="tl-result" class="arc-tl" hidden></div>
                </div>
            </div>
        </section>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Frame — Zenivo</title>
    <meta name="theme-color" content="#070a13">
    <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="description" content="Full live frame of the Zenivo all-sky camera for OBS and kiosk displays.">
    <link rel="stylesheet" href="/static/css/ds-tokens.css?v=20261203h">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100vw; height: 100vh; overflow: hidden;
            background: var(--c-bg);
            font-family: var(--font-ui);
            user-select: none; -webkit-user-select: none;
        }
        body.bg-transparent { background: transparent !important; }
        #obs-stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #obs-viewport { position: absolute; inset: 0; transform-origin: center center; will-change: transform; }
        .media-layer {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; object-position: center center; display: block;
            user-select: none; -webkit-user-drag: none;
        }
        body.fit-contain .media-layer { object-fit: contain; }
        #replay-img, #replay-video { display: none; z-index: var(--z-nav); background: var(--c-bg); }
        body.bg-transparent #replay-img, body.bg-transparent #replay-video { background: transparent; }
        #reticle-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: block; z-index: var(--z-nav); }
        body.night-vision .media-layer { filter: brightness(0.76) contrast(1.15) sepia(100%) hue-rotate(315deg) saturate(320%); }
        #sky-frame { background: var(--c-bg); }

        /* Picture-in-picture close-up for meteor / aircraft replay */
        #replay-pip {
            position: absolute; top: var(--s-8); right: var(--s-6);
            width: min(320px, 28vw); aspect-ratio: 1 / 1;
            background: var(--c-scrim); border: 2px solid var(--c-accent); border-radius: var(--r-md);
            overflow: hidden; box-shadow: var(--shadow-2); z-index: var(--z-fab); display: none;
        }
        #replay-pip img { width: 100%; height: 100%; object-fit: contain; display: block; }
        #replay-pip-caption {
            position: absolute; left: 0; right: 0; bottom: 0;
            background: var(--c-scrim); color: var(--c-accent);
            font-size: var(--fs-12); font-weight: 700; text-align: center;
            padding: var(--s-1) var(--s-2); text-transform: uppercase;
        }

        /* Replay status pill */
        #replay-badge {
            position: absolute; top: var(--s-4); right: var(--s-4);
            background: var(--c-scrim); border: 1.5px solid var(--c-warn); color: var(--c-text);
            padding: var(--s-2) var(--s-3); border-radius: var(--r-md);
            font-size: var(--fs-14); font-weight: 700; box-shadow: var(--shadow-2);
            z-index: var(--z-fab); display: none;
        }

        /* Title / lower-third banner */
        #obs-title-box {
            position: absolute; z-index: var(--z-fab);
            background: var(--c-scrim); border-left: 4px solid var(--c-accent);
            padding: var(--s-3) var(--s-4); border-radius: var(--r-md);
            box-shadow: var(--shadow-2); backdrop-filter: blur(4px);
            max-width: 80vw; display: none; pointer-events: none;
        }
        #obs-title-box.pos-bottom-left { bottom: var(--s-6); left: var(--s-6); }
        #obs-title-box.pos-top-left { top: var(--s-8); left: var(--s-6); }
        #obs-title-box.pos-bottom-center, #obs-title-box.pos-top-center {
            left: 50%; transform: translateX(-50%);
            border-left: none; border-bottom: 3px solid var(--c-accent); text-align: center;
        }
        #obs-title-box.pos-bottom-center { bottom: var(--s-6); }
        #obs-title-box.pos-top-center { top: var(--s-5); }
        #obs-title-main { color: var(--c-text); font-size: var(--fs-22); font-weight: 800; line-height: var(--lh-tight); text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9); }
        #obs-title-sub { color: var(--c-accent); font-size: var(--fs-14); font-weight: 600; margin-top: var(--s-1); text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9); }
    </style>
</head>
<body>
    <div id="obs-stage">
        <div id="obs-viewport">
            <img id="live-stream-img" class="media-layer" alt="Live all-sky stream" draggable="false" />
            <img id="replay-img" class="media-layer" alt="Replay Image" draggable="false" />
            <video id="replay-video" class="media-layer" loop muted playsinline></video>
            <canvas id="reticle-canvas"></canvas>
            <iframe id="sky-frame" title="Sky View" allow="fullscreen" style="display:none;position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>
        </div>

        <div id="replay-badge"></div>
        <div id="replay-pip">
            <img id="replay-pip-img" alt="Event Close-up" />
            <div id="replay-pip-caption">Close-up</div>
        </div>

        <div id="obs-title-box" class="pos-bottom-left">
            <div id="obs-title-main"></div>
            <div id="obs-title-sub"></div>
        </div>
    </div>

    <!-- Sky Catalog for Astrometric Reticle & Constellations -->
    <script src="/static/sky_catalog.js"></script>

    <script>
        const TK = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
        (function () {
            const params = new URLSearchParams(window.location.search);
            const stage = document.getElementById("obs-stage");
            const viewport = document.getElementById("obs-viewport");
            const img = document.getElementById("live-stream-img");
            const replayImg = document.getElementById("replay-img");
            const replayVideo = document.getElementById("replay-video");
            const replayBadge = document.getElementById("replay-badge");
            const skyFrame = document.getElementById("sky-frame");
            const replayPip = document.getElementById("replay-pip");
            const replayPipImg = document.getElementById("replay-pip-img");
            const titleBox = document.getElementById("obs-title-box");
            const titleMain = document.getElementById("obs-title-main");
            const titleSub = document.getElementById("obs-title-sub");
            const canvas = document.getElementById("reticle-canvas");
            const ASB1_HEADER_TOTAL = 4188;

            const overlayState = {
                dso_overlay: false,
                sky_overlay: false,
                sky_labels: false,
                grid_overlay: false,
                sun_moon: true,
                badge: true,
                adsb_overlay: false,
                events_overlay: false,
                fit: "cover",
                res: "stream",
                bg: "black",
                night_vision: false,
                opacity: 1.0,
                zoom: 1.0,
                pan_x: 0.0,
                pan_y: 0.0,
                rotate: 0.0,
                flip_h: false,
                flip_v: false,
                brightness: 1.0,
                contrast: 1.0,
                title_text: "",
                title_sub: "",
                title_pos: "bottom-left",
                view_mode: "live",
                replay_url: "",
                replay_crop_url: "",
                replay_label: "",
                replay_bbox: [],
            };

            let stationLoaded = false; // stationConfig below holds only placeholder defaults until /api/station/config answers
            let stationConfig = {
                latitude_deg: 0,
                longitude_deg: 0,
                camera_sensor: { width_px: 2592, height_px: 1944 },
                optics: {
                    lens_model: "Fisheye 1.65mm f/2.0 AllSky",
                    projection_type: "Fisheye Equidistant AllSky",
                    optical_center_x_px: 1296,
                    optical_center_y_px: 972,
                    horizon_radius_90_px: 894.2,
                    fov_horizontal_deg: 180,
                },
                orientation: {
                    zenith_tilt_deg: 0.0,
                    azimuth_deg: 180.0,
                    north_position_angle_deg: 0.0,
                },
                image_transform: {
                    flip_horizontal: false,
                    flip_vertical: false,
                    rotate_deg: 0,
                },
            };

            let liveAircraft = [];
            let recentEvents = [];
            let adsbTimer = null;
            let eventsTimer = null;

            // Picture size: the dock setting (overlayState.res, default "stream" = same as /live); ?res=full|stream overrides it
            let useFullRes = params.get("res") === "full";
            let activeObjectUrl = null;
            let lastFrameTs = -1;
            let ws = null;
            let reconnectTimer = null;

            async function pollAdsb() {
                if (!overlayState.adsb_overlay) return;
                try {
                    const r = await fetch("/api/adsb/aircraft?limit=35");
                    if (r.ok) {
                        const d = await r.json();
                        liveAircraft = d.aircraft || [];
                        drawReticle();
                    }
                } catch (e) {}
            }

            async function pollEvents() {
                if (!overlayState.events_overlay) return;
                try {
                    const r = await fetch("/api/events?limit=15");
                    if (r.ok) {
                        const d = await r.json();
                        recentEvents = d.events || [];
                        drawReticle();
                    }
                } catch (e) {}
            }

            function manageOverlayPolls() {
                if (overlayState.adsb_overlay && !adsbTimer) {
                    pollAdsb();
                    adsbTimer = setInterval(pollAdsb, 4000);
                } else if (!overlayState.adsb_overlay && adsbTimer) {
                    clearInterval(adsbTimer);
                    adsbTimer = null;
                }

                if (overlayState.events_overlay && !eventsTimer) {
                    pollEvents();
                    eventsTimer = setInterval(pollEvents, 12000);
                } else if (!overlayState.events_overlay && eventsTimer) {
                    clearInterval(eventsTimer);
                    eventsTimer = null;
                }
            }

            function applyOverlaySettings(settings) {
                if (settings && typeof settings === "object") {
                    Object.assign(overlayState, settings);
                }
                const wantFull = params.get("res") ? params.get("res") === "full" : overlayState.res === "full";
                if (wantFull !== useFullRes) {
                    useFullRes = wantFull;
                    if (typeof connectWebSocket === "function" && ws) connectWebSocket();   // new size: reopen the stream
                }
                if (params.get("fit")) overlayState.fit = params.get("fit");
                if (params.get("bg")) overlayState.bg = params.get("bg");
                if (params.get("stars") !== null) overlayState.sky_overlay = params.get("stars") === "1" || params.get("stars") === "true";
                if (params.get("labels") !== null) overlayState.sky_labels = params.get("labels") === "1" || params.get("labels") === "true";
                if (params.get("dso") !== null) overlayState.dso_overlay = params.get("dso") === "1" || params.get("dso") === "true";
                if (params.get("grid") !== null) overlayState.grid_overlay = params.get("grid") === "1" || params.get("grid") === "true";
                if (params.get("badge") !== null) overlayState.badge = params.get("badge") === "1" || params.get("badge") === "true";
                if (params.get("sun_moon") !== null) overlayState.sun_moon = params.get("sun_moon") === "1" || params.get("sun_moon") === "true";
                if (params.get("night") !== null) overlayState.night_vision = params.get("night") === "1" || params.get("night") === "true";
                if (params.get("opacity") !== null) overlayState.opacity = parseFloat(params.get("opacity"));

                document.body.classList.toggle("fit-contain", overlayState.fit === "contain");
                document.body.classList.toggle("bg-transparent", overlayState.bg === "transparent");
                document.body.classList.toggle("night-vision", !!overlayState.night_vision);

                // Transform: Zoom, Pan, Rotate, Flip
                const z = Number(overlayState.zoom) || 1.0;
                const px = Number(overlayState.pan_x) || 0.0;
                const py = Number(overlayState.pan_y) || 0.0;
                const rot = Number(overlayState.rotate) || 0.0;
                const sx = overlayState.flip_h ? -1 : 1;
                const sy = overlayState.flip_v ? -1 : 1;
                viewport.style.transform = `translate(${px}%, ${py}%) scale(${z}) rotate(${rot}deg)`;

                const br = Number(overlayState.brightness) || 1.0;
                const ct = Number(overlayState.contrast) || 1.0;
                const mediaFilter = (br !== 1.0 || ct !== 1.0) ? `brightness(${br}) contrast(${ct})` : "none";
                const flipTransform = (sx !== 1 || sy !== 1) ? `scale(${sx}, ${sy})` : "none";

                [img, replayImg, replayVideo].forEach((el) => {
                    el.style.filter = mediaFilter;
                    el.style.transform = flipTransform;
                });

                if (canvas) {
                    canvas.style.opacity = overlayState.opacity !== undefined ? overlayState.opacity : 1.0;
                }

                // Title / Lower-Third
                const tMain = (overlayState.title_text || "").trim();
                const tSub = (overlayState.title_sub || "").trim();
                if (tMain) {
                    titleMain.textContent = tMain;
                    titleSub.textContent = tSub;
                    titleSub.style.display = tSub ? "block" : "none";
                    titleBox.className = "pos-" + (overlayState.title_pos || "bottom-left");
                    titleBox.style.display = "block";
                } else {
                    titleBox.style.display = "none";
                }

                // View Mode: live vs event/timelapse/keogram/startrails
                const mode = overlayState.view_mode || "live";
                const isSky = mode === "sky" || (mode === "event" && String(overlayState.replay_url || "").startsWith("/sky"));
                if (!isSky && skyFrame.dataset.src) {
                    skyFrame.dataset.src = "";
                    skyFrame.src = "about:blank";
                    skyFrame.style.display = "none";
                }
                if (isSky) {
                    const skyUrl = String(overlayState.replay_url || "").startsWith("/sky") ? overlayState.replay_url : "/sky?embed=1";
                    if (skyFrame.dataset.src !== skyUrl) {
                        skyFrame.dataset.src = skyUrl;
                        skyFrame.src = skyUrl;
                    }
                    skyFrame.style.display = "block";
                    replayImg.style.display = "none";
                    replayVideo.style.display = "none";
                    replayVideo.pause();
                    replayPip.style.display = "none";
                    canvas.style.display = "none";
                    replayBadge.textContent = overlayState.replay_label || "SKY VIEW";
                    replayBadge.style.display = "block";
                } else if (mode === "live") {
                    replayImg.style.display = "none";
                    replayVideo.style.display = "none";
                    replayVideo.pause();
                    replayBadge.style.display = "none";
                    replayPip.style.display = "none";
                    canvas.style.display = "block";
                } else if (mode === "timelapse") {
                    const vUrl = overlayState.replay_url || "/uploads/allsky/timelapses/latest.mp4";
                    replayImg.style.display = "none";
                    if (replayVideo.dataset.src !== vUrl) {
                        replayVideo.dataset.src = vUrl;
                        replayVideo.src = vUrl + "?t=" + Date.now();
                    }
                    replayVideo.style.display = "block";
                    replayVideo.play().catch(() => {});
                    replayBadge.textContent = overlayState.replay_label || "🎬 TIMELAPSE";
                    replayBadge.style.display = "block";
                    replayPip.style.display = "none";
                    canvas.style.display = "none";
                } else {
                    // event, keogram, startrails
                    replayVideo.style.display = "none";
                    replayVideo.pause();
                    let iUrl = overlayState.replay_url;
                    if (!iUrl && mode === "keogram") iUrl = "/uploads/allsky/keograms/latest.jpg";
                    if (!iUrl && mode === "startrails") iUrl = "/uploads/allsky/startrails/latest.jpg";
                    if (iUrl) {
                        if (replayImg.dataset.src !== iUrl) {
                            replayImg.dataset.src = iUrl;
                            replayImg.src = iUrl;
                        }
                        replayImg.style.display = "block";
                    }
                    replayBadge.textContent = overlayState.replay_label || (mode === "keogram" ? "📊 KEOGRAM" : mode === "startrails" ? "🌀 STARTRAILS" : "⏪ XEM LẠI SỰ KIỆN");
                    replayBadge.style.display = "block";

                    if (mode === "event" && overlayState.replay_crop_url) {
                        replayPipImg.src = overlayState.replay_crop_url;
                        replayPip.style.display = "block";
                    } else {
                        replayPip.style.display = "none";
                    }
                    // Keep celestial overlay available on event sky image if enabled
                    canvas.style.display = mode === "event" ? "block" : "none";
                }

                manageOverlayPolls();
                drawReticle();
            }

            function computeLmstDeg(lonDeg, dateObj) {
                const jd = dateObj.getTime() / 86400000.0 + 2440587.5;
                const d = jd - 2451545.0;
                const t = d / 36525.0;
                const gmst =
                    (280.46061837 +
                        360.98564736629 * d +
                        0.000387933 * t * t -
                        (t * t * t) / 38710000.0) %
                    360.0;
                return ((gmst + lonDeg) % 360.0 + 360.0) % 360.0;
            }

            function formatLstHms(deg) {
                const totalHours = (((deg / 15.0) % 24.0) + 24.0) % 24.0;
                const h = Math.floor(totalHours);
                const m = Math.floor((totalHours - h) * 60.0);
                const s = Math.floor(((totalHours - h) * 60.0 - m) * 60.0);
                return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
            }

            function sunMoonEquatorial(dateObj) {
                const d2r = Math.PI / 180.0;
                const r2d = 180.0 / Math.PI;
                const d = dateObj.getTime() / 86400000.0 + 2440587.5 - 2451545.0;
                const eps = (23.439 - 0.0000004 * d) * d2r;

                const toEq = (eclLonDeg, eclLatDeg) => {
                    const l = eclLonDeg * d2r;
                    const b = eclLatDeg * d2r;
                    const x = Math.cos(b) * Math.cos(l);
                    const y = Math.cos(b) * Math.sin(l) * Math.cos(eps) - Math.sin(b) * Math.sin(eps);
                    const z = Math.cos(b) * Math.sin(l) * Math.sin(eps) + Math.sin(b) * Math.cos(eps);
                    const ra = ((Math.atan2(y, x) * r2d) % 360.0 + 360.0) % 360.0;
                    const dec = Math.asin(Math.max(-1, Math.min(1, z))) * r2d;
                    return { ra, dec };
                };

                const Ls = (280.46 + 0.9856474 * d) % 360.0;
                const g = (357.528 + 0.9856003 * d) * d2r;
                const sunLon = Ls + 1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g);

                const Lm = (218.32 + 13.176396 * d) % 360.0;
                const Mm = (134.96 + 13.064993 * d) * d2r;
                const F = (93.27 + 13.22935 * d) * d2r;
                const D = (297.85 + 12.190749 * d) * d2r;
                const moonLon = Lm + 6.289 * Math.sin(Mm) + 1.274 * Math.sin(2 * D - Mm) + 0.658 * Math.sin(2 * D) - 0.186 * Math.sin(g);
                const moonLat = 5.128 * Math.sin(F);
                const elong = Math.acos(Math.cos((moonLon - sunLon) * d2r) * Math.cos(moonLat * d2r));
                return {
                    sun: toEq(sunLon, 0),
                    moon: { ...toEq(moonLon, moonLat), illum: (1 - Math.cos(elong)) / 2 },
                };
            }

            // Planets for the Solar System toggle: server alt/az, refreshed every 60 s (not per frame)
            let skyBodies = [];
            async function pollSkyBodies() {
                try {
                    const r = await fetch("/api/sky/bodies");
                    if (!r.ok) return;
                    const d = await r.json();
                    skyBodies = (d.bodies || []).filter((b) => b && b.name && b.name !== "Sun" && b.name !== "Moon" && typeof b.alt === "number" && typeof b.az === "number");
                    drawReticle();
                } catch (e) { /* keep last data */ }
            }
            pollSkyBodies();
            setInterval(pollSkyBodies, 60000);

            function drawReticle() {
                if (!canvas || !stage) return;
                const w = stage.clientWidth;
                const h = stage.clientHeight;
                if (w <= 10 || h <= 10) return;

                const pxRatio = Math.min(3, window.devicePixelRatio || 1);
                canvas.width = Math.round(w * pxRatio);
                canvas.height = Math.round(h * pxRatio);
                const ctx = canvas.getContext("2d");
                ctx.setTransform(pxRatio, 0, 0, pxRatio, 0, 0);
                ctx.clearRect(0, 0, w, h);

                const showSky = !!overlayState.sky_overlay;
                const showLabels = !!overlayState.sky_labels;
                const showGrid = !!overlayState.grid_overlay;
                const showSunMoon = overlayState.sun_moon !== false;
                const showBadge = overlayState.badge !== false;
                const showAdsb = !!overlayState.adsb_overlay;
                const showEvents = !!overlayState.events_overlay;
                const showDso = !!overlayState.dso_overlay;
                if (!showSky && !showDso && !showLabels && !showGrid && !showSunMoon && !showBadge && !showAdsb && !showEvents) return;

                const st = stationConfig || {};
                // Station data not loaded yet: the hard-coded fallbacks below would draw a wrong map on first paint.
                if (!stationLoaded) return;
                const sensor = st.camera_sensor || {};
                const optics = st.optics || {};
                const ori = st.orientation || {};

                const sensorW = Number(sensor.width_px || 2592);
                const sensorH = Number(sensor.height_px || 1944);
                const latDeg = Number(st.latitude_deg !== undefined ? st.latitude_deg : 0);
                const lonDeg = Number(st.longitude_deg !== undefined ? st.longitude_deg : 0);

                const optX = Number(optics.optical_center_x_px !== undefined ? optics.optical_center_x_px : sensorW / 2.0);
                const optY = Number(optics.optical_center_y_px !== undefined ? optics.optical_center_y_px : sensorH / 2.0);
                const r90SensorPx = Number(optics.horizon_radius_90_px !== undefined ? optics.horizon_radius_90_px : Math.min(sensorW, sensorH) * 0.46);

                const northPaDeg = Number(ori.north_position_angle_deg || 0.0);
                const tiltDeg = Number(ori.zenith_tilt_deg || 0.0);
                const tiltAzDeg = Number(ori.azimuth_deg !== undefined ? ori.azimuth_deg : 180.0);

                const containerAspect = w / Math.max(1, h);
                const sensorAspect = sensorW / Math.max(1, sensorH);
                let renderW = w;
                let renderH = h;
                let offsetX = 0;
                let offsetY = 0;

                const isCover = overlayState.fit !== "contain";
                if (isCover) {
                    if (containerAspect > sensorAspect) {
                        renderW = w;
                        renderH = w / sensorAspect;
                        offsetY = (h - renderH) / 2.0;
                    } else {
                        renderH = h;
                        renderW = h * sensorAspect;
                        offsetX = (w - renderW) / 2.0;
                    }
                } else {
                    if (containerAspect > sensorAspect) {
                        renderH = h;
                        renderW = h * sensorAspect;
                        offsetX = (w - renderW) / 2.0;
                    } else {
                        renderW = w;
                        renderH = w / sensorAspect;
                        offsetY = (h - renderH) / 2.0;
                    }
                }

                const scaleX = renderW / sensorW;
                const scaleY = renderH / sensorH;
                const scaleMean = (scaleX + scaleY) * 0.5;

                ctx.save();
                if (!isCover) {
                    ctx.beginPath();
                    ctx.rect(offsetX, offsetY, renderW, renderH);
                    ctx.clip();
                }

                const tf = st.image_transform || {};
                const rot180 = Number(tf.rotate_deg || 0) % 360 === 180;
                const mirrorX = (!!tf.flip_horizontal !== rot180) !== !!overlayState.flip_h;
                const mirrorY = (!!tf.flip_vertical !== rot180) !== !!overlayState.flip_v;
                const toImgX = (sx) => (mirrorX ? sensorW - sx : sx);
                const toImgY = (sy) => (mirrorY ? sensorH - sy : sy);

                const cxCanvas = offsetX + toImgX(optX) * scaleX;
                const cyCanvas = offsetY + toImgY(optY) * scaleY;
                const r90Canvas = r90SensorPx * scaleMean;

                const nowUtc = new Date();
                const lmstDeg = computeLmstDeg(lonDeg, nowUtc);
                const latRad = (latDeg * Math.PI) / 180.0;
                const sinLat = Math.sin(latRad);
                const cosLat = Math.cos(latRad);
                const northAngleRad = (northPaDeg * Math.PI) / 180.0;
                const tiltRad = (tiltDeg * Math.PI) / 180.0;
                const tiltAzRad = (tiltAzDeg * Math.PI) / 180.0;
                const cosTilt = Math.cos(tiltRad);
                const sinTilt = Math.sin(tiltRad);
                const cosTiltAz = Math.cos(tiltAzRad);
                const sinTiltAz = Math.sin(tiltAzRad);

                const hfovDeg = Number(optics.fov_horizontal_deg || 0);
                const lensProj = optics.lens_projection || (/gnomonic|rectilinear/i.test(String(optics.projection_type || "")) ? "rectilinear" : "");
                const isFisheyePointing = !!optics.pointing_model && lensProj === "equidistant" && Number(optics.focal_length_px) > 0;
                const isRectilinear = isFisheyePointing || (lensProj === "rectilinear" && hfovDeg > 1 && hfovDeg < 170);
                const distK = Number(optics.distortion_k || 0);
                let camX = null, camY = null, camZ = null, fPx = 0;
                if (isRectilinear) {
                    const d2r = Math.PI / 180.0;
                    const pAlt = Number(ori.altitude_deg !== undefined ? ori.altitude_deg : 90.0 - tiltDeg) * d2r;
                    const pAz = tiltAzDeg * d2r;
                    const roll = northPaDeg * d2r;
                    fPx = Number(optics.focal_length_px) > 0
                        ? Number(optics.focal_length_px)
                        : (sensorW / 2.0) / Math.tan((hfovDeg / 2.0) * d2r);
                    camZ = [Math.cos(pAlt) * Math.sin(pAz), Math.cos(pAlt) * Math.cos(pAz), Math.sin(pAlt)];
                    let vert = [-camZ[2] * camZ[0], -camZ[2] * camZ[1], 1.0 - camZ[2] * camZ[2]];
                    const vLen = Math.hypot(vert[0], vert[1], vert[2]) || 1;
                    vert = vert.map((c) => c / vLen);
                    const zxv = [
                        camZ[1] * vert[2] - camZ[2] * vert[1],
                        camZ[2] * vert[0] - camZ[0] * vert[2],
                        camZ[0] * vert[1] - camZ[1] * vert[0],
                    ];
                    const up = vert.map((c, i) => c * Math.cos(roll) + zxv[i] * Math.sin(roll));
                    camY = up.map((c) => -c);
                    camX = [
                        camY[1] * camZ[2] - camY[2] * camZ[1],
                        camY[2] * camZ[0] - camY[0] * camZ[2],
                        camY[0] * camZ[1] - camY[1] * camZ[0],
                    ];
                }

                function projectAltAzToCanvas(altDeg, azDeg) {
                    if (isRectilinear) {
                        const a = (altDeg * Math.PI) / 180.0;
                        const z = (azDeg * Math.PI) / 180.0;
                        const v = [Math.cos(a) * Math.sin(z), Math.cos(a) * Math.cos(z), Math.sin(a)];
                        const dot = (u) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
                        const cz = dot(camZ);
                        const thetaRad = Math.acos(Math.max(-1, Math.min(1, cz)));
                        const theta = (thetaRad * 180.0) / Math.PI;
                        let sensorPx, sensorPy;
                        if (isFisheyePointing) {
                            if (theta > 110) return { x: NaN, y: NaN, alt: altDeg, az: azDeg, theta, visible: false };
                            const cx = dot(camX), cy = dot(camY);
                            const rho = Math.hypot(cx, cy) || 1e-12;
                            const r = fPx * (thetaRad + distK * thetaRad * thetaRad * thetaRad);
                            sensorPx = optX + (r * cx) / rho;
                            sensorPy = optY + (r * cy) / rho;
                        } else {
                            if (cz < 0.05) return { x: NaN, y: NaN, alt: altDeg, az: azDeg, theta, visible: false };
                            const xn = dot(camX) / cz, yn = dot(camY) / cz;
                            const sk = 1 + distK * (xn * xn + yn * yn); // radial distortion r = f t (1 + k t^2), same as bright_star_solver._project
                            sensorPx = optX + fPx * xn * sk;
                            sensorPy = optY + fPx * yn * sk;
                        }
                        const canvasX = offsetX + toImgX(sensorPx) * scaleX;
                        const canvasY = offsetY + toImgY(sensorPy) * scaleY;
                        const inViewport =
                            canvasX >= offsetX - 10 && canvasX <= offsetX + renderW + 10 &&
                            canvasY >= offsetY - 10 && canvasY <= offsetY + renderH + 10;
                        return { x: canvasX, y: canvasY, alt: altDeg, az: azDeg, theta, visible: inViewport && altDeg >= -1.5 };
                    }
                    const altRad = (altDeg * Math.PI) / 180.0;
                    const azRad = (azDeg * Math.PI) / 180.0;
                    const cosAlt = Math.cos(altRad);
                    const sinAlt = Math.sin(altRad);

                    let vN = cosAlt * Math.cos(azRad);
                    let vE = cosAlt * Math.sin(azRad);
                    let vZ = sinAlt;

                    if (Math.abs(tiltDeg) > 0.01) {
                        const uPar = vN * cosTiltAz + vE * sinTiltAz;
                        const uPerp = -vN * sinTiltAz + vE * cosTiltAz;
                        const uParRot = uPar * cosTilt - vZ * sinTilt;
                        vZ = uPar * sinTilt + vZ * cosTilt;
                        vN = uParRot * cosTiltAz - uPerp * sinTiltAz;
                        vE = uParRot * sinTiltAz + uPerp * cosTiltAz;
                    }

                    const thetaDeg = (Math.acos(Math.max(-1.0, Math.min(1.0, vZ))) * 180.0) / Math.PI;
                    const rPx = r90SensorPx * (thetaDeg / 90.0);
                    const camAzRad = Math.atan2(vE, vN) - northAngleRad;

                    const sensorPx = optX - rPx * Math.sin(camAzRad);
                    const sensorPy = optY - rPx * Math.cos(camAzRad);

                    const canvasX = offsetX + toImgX(sensorPx) * scaleX;
                    const canvasY = offsetY + toImgY(sensorPy) * scaleY;
                    const inDome = thetaDeg <= 93.0 && altDeg >= -1.5;
                    const inViewport =
                        canvasX >= offsetX - 10 &&
                        canvasX <= offsetX + renderW + 10 &&
                        canvasY >= offsetY - 10 &&
                        canvasY <= offsetY + renderH + 10;

                    return {
                        x: canvasX,
                        y: canvasY,
                        alt: altDeg,
                        az: azDeg,
                        theta: thetaDeg,
                        visible: inDome && inViewport,
                    };
                }

                function projectRaDecToCanvas(raDeg, decDeg) {
                    const haRad = ((((lmstDeg - raDeg) % 360.0) + 360.0) % 360.0) * (Math.PI / 180.0);
                    const decRad = (decDeg * Math.PI) / 180.0;
                    const sinDec = Math.sin(decRad);
                    const cosDec = Math.cos(decRad);

                    const sinAlt = Math.max(-1.0, Math.min(1.0, sinLat * sinDec + cosLat * cosDec * Math.cos(haRad)));
                    const altRad = Math.asin(sinAlt);
                    const altDeg = (altRad * 180.0) / Math.PI;

                    const y = -Math.sin(haRad) * cosDec;
                    const x = sinDec * cosLat - cosDec * sinLat * Math.cos(haRad);
                    const azDeg = ((Math.atan2(y, x) * 180.0) / Math.PI + 360.0) % 360.0;

                    return projectAltAzToCanvas(altDeg, azDeg);
                }

                const isNight = !!overlayState.night_vision;
                const colors = isNight
                    ? {
                          gridLine: "rgba(239, 68, 68, 0.35)",
                          gridHorizon: "rgba(239, 68, 68, 0.75)",
                          gridText: "rgba(252, 165, 165, 0.9)",
                          compass: TK("--c-danger"),
                          constLine: "rgba(239, 68, 68, 0.55)",
                          starFill: "rgba(254, 202, 202, 0.95)",
                          starGlow: "rgba(239, 68, 68, 0.75)",
                          labelBg: "rgba(30, 0, 0, 0.75)",
                          labelBorder: "rgba(239, 68, 68, 0.4)",
                          labelText: TK("--c-danger"),
                          badgeBg: "rgba(20, 0, 0, 0.8)",
                          badgeBorder: "rgba(239, 68, 68, 0.45)",
                          badgeText: TK("--c-danger"),
                      }
                    : {
                          gridLine: "rgba(56, 189, 248, 0.25)",
                          gridHorizon: "rgba(56, 189, 248, 0.65)",
                          gridText: "rgba(148, 163, 184, 0.85)",
                          compass: TK("--c-accent"),
                          constLine: "rgba(56, 189, 248, 0.45)",
                          starFill: "rgba(255, 255, 255, 0.95)",
                          starGlow: "rgba(56, 189, 248, 0.7)",
                          labelBg: "rgba(2, 6, 23, 0.7)",
                          labelBorder: "rgba(56, 189, 248, 0.3)",
                          labelText: "rgba(186, 230, 253, 0.9)",
                          badgeBg: "rgba(2, 6, 23, 0.72)",
                          badgeBorder: "rgba(56, 189, 248, 0.35)",
                          badgeText: TK("--c-text"),
                      };

                // 1. Grid & Compass Overlay
                if (showGrid) {
                    ctx.save();
                    if (isRectilinear) {
                        const polyline = (pts) => {
                            let pen = false;
                            ctx.beginPath();
                            pts.forEach((p) => {
                                if (!Number.isFinite(p.x) || p.theta > (isFisheyePointing ? 100 : 85)) { pen = false; return; }
                                if (pen) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
                                pen = true;
                            });
                            ctx.stroke();
                        };
                        for (let alt = 0; alt <= 75; alt += 15) {
                            ctx.strokeStyle = alt === 0 ? colors.gridHorizon : colors.gridLine;
                            ctx.lineWidth = alt === 0 ? 1.5 : 1;
                            ctx.setLineDash(alt === 0 ? [] : [4, 4]);
                            const pts = [];
                            for (let az = 0; az <= 360; az += 2) pts.push(projectAltAzToCanvas(alt, az));
                            polyline(pts);
                            const tag = projectAltAzToCanvas(alt, tiltAzDeg);
                            if (alt > 0 && tag.visible) {
                                ctx.fillStyle = colors.gridText;
                                ctx.font = "bold 13px monospace";
                                ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
                                ctx.shadowBlur = 4;
                                ctx.fillText(`${alt}°`, tag.x + 6, tag.y - 4);
                                ctx.shadowBlur = 0;
                            }
                        }
                        ctx.setLineDash([]);
                        ctx.fillStyle = colors.compass;
                        ctx.font = "bold 18px monospace";
                        ctx.textAlign = "center";
                        ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
                        ctx.shadowBlur = 5;
                        ["N", "NE", "E", "SE", "S", "SW", "W", "NW"].forEach((label, i) => {
                            for (const alt of [2, 20, 40]) {
                                const p = projectAltAzToCanvas(alt, i * 45);
                                if (p.visible) { ctx.fillText(label, p.x, p.y - 8); break; }
                            }
                        });
                        ctx.shadowBlur = 0;
                    } else {
                        [0, 30, 60].forEach((alt) => {
                            const rPx = r90Canvas * ((90.0 - alt) / 90.0);
                            ctx.beginPath();
                            ctx.arc(cxCanvas, cyCanvas, rPx, 0, 2 * Math.PI);
                            ctx.strokeStyle = alt === 0 ? colors.gridHorizon : colors.gridLine;
                            ctx.lineWidth = alt === 0 ? 1.5 : 1;
                            ctx.setLineDash(alt === 0 ? [] : [4, 4]);
                            ctx.stroke();
                        });
                        ctx.setLineDash([]);

                        ctx.strokeStyle = colors.gridHorizon;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(cxCanvas - 10, cyCanvas);
                        ctx.lineTo(cxCanvas + 10, cyCanvas);
                        ctx.moveTo(cxCanvas, cyCanvas - 10);
                        ctx.lineTo(cxCanvas, cyCanvas + 10);
                        ctx.stroke();

                        ctx.font = "bold 14px monospace";
                        ctx.fillStyle = colors.compass;
                        ctx.textAlign = "center";
                        ctx.textBaseline = "middle";
                        [
                            { az: 0, text: "N" },
                            { az: 90, text: "E" },
                            { az: 180, text: "S" },
                            { az: 270, text: "W" },
                        ].forEach((c) => {
                            const p = projectAltAzToCanvas(0, c.az);
                            if (p.visible) ctx.fillText(c.text, p.x, p.y);
                        });
                    }
                    ctx.restore();
                }

                // 2. Stars & Constellations
                const catalog = window.ALLSKY_CATALOG || {};
                if (showSky && catalog.constellations) {
                    ctx.save();
                    ctx.strokeStyle = colors.constLine;
                    ctx.lineWidth = 1.2;

                    catalog.constellations.forEach((c) => {
                        if (c.lines) {
                            c.lines.forEach((seg) => {
                                const p1 = projectRaDecToCanvas(seg[0][0], seg[0][1]);
                                const p2 = projectRaDecToCanvas(seg[1][0], seg[1][1]);
                                if (p1.visible && p2.visible) {
                                    ctx.beginPath();
                                    ctx.moveTo(p1.x, p1.y);
                                    ctx.lineTo(p2.x, p2.y);
                                    ctx.stroke();
                                }
                            });
                        }
                    });

                    if (catalog.bright_stars) {
                        catalog.bright_stars.forEach((s) => {
                            const p = projectRaDecToCanvas(s.ra, s.dec);
                            if (p.visible) {
                                const mag = Number(s.mag !== undefined ? s.mag : 2.0);
                                const radius = Math.max(1.8, Math.min(5.5, 4.8 - mag * 0.9));
                                ctx.beginPath();
                                ctx.arc(p.x, p.y, radius, 0, 2 * Math.PI);
                                ctx.fillStyle = colors.starFill;
                                ctx.shadowColor = colors.starGlow;
                                ctx.shadowBlur = radius * 1.5;
                                ctx.fill();
                                ctx.shadowBlur = 0;
                            }
                        });
                    }
                    ctx.restore();
                }

                // 3. Labels (no boxes). LABEL_STYLE sizes are in OUTPUT pixels of the OBS source; they are divided by
                // the effective on-screen scale kd (viewport CSS zoom) so they stay the same size at any zoom.
                const LABEL_STYLE = {
                    conPx: 17, conWeight: 600, conFill: "rgba(240, 248, 255, 0.85)", conSpacing: 0.5,
                    starPx: 13.5, starWeight: 500, starFill: "rgba(255, 244, 220, 0.85)", starDx: 7, starDy: -3,
                    planetPx: 13.5, planetWeight: 600, planetFill: "rgba(255, 236, 190, 0.92)", planetDot: 3.5,
                    dsoPx: 13.5, dsoWeight: 500, dsoFill: "rgba(196, 230, 255, 0.9)", dsoR: 5,
                    outlinePx: 1.5, outline: "rgba(0, 0, 0, 0.8)", shadow: "rgba(0, 0, 0, 0.45)", shadowPx: 3,
                };
                let kd = 1;
                try {
                    const m = new DOMMatrix(getComputedStyle(viewport).transform);
                    kd = Math.hypot(m.a, m.b) || 1;
                } catch (e) { kd = Number(overlayState.zoom) || 1; }
                kd = Math.max(0.2, kd);
                const lp = (outPx) => outPx / kd; // output px -> canvas units
                const nightLabel = (c) => (isNight ? colors.labelText : c);
                function drawLabel(txt, x, y, px, weight, fill, align, spacing) {
                    ctx.font = `${weight} ${lp(px)}px Inter, system-ui, sans-serif`;
                    if ("letterSpacing" in ctx) ctx.letterSpacing = spacing ? `${lp(spacing)}px` : "0px";
                    ctx.textAlign = align;
                    ctx.textBaseline = "middle";
                    ctx.lineJoin = "round";
                    ctx.lineWidth = lp(LABEL_STYLE.outlinePx * 2);
                    ctx.strokeStyle = LABEL_STYLE.outline;
                    ctx.shadowColor = LABEL_STYLE.shadow;
                    ctx.shadowBlur = lp(LABEL_STYLE.shadowPx);
                    ctx.strokeText(txt, x, y);
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = nightLabel(fill);
                    ctx.fillText(txt, x, y);
                }

                if (showLabels && catalog.constellations) {
                    ctx.save();
                    catalog.constellations.forEach((c) => {
                        if (c.ra !== undefined && c.dec !== undefined) {
                            const p = projectRaDecToCanvas(c.ra, c.dec);
                            if (p.visible) drawLabel(c.name || c.id, p.x, p.y, LABEL_STYLE.conPx, LABEL_STYLE.conWeight, LABEL_STYLE.conFill, "center", LABEL_STYLE.conSpacing);
                        }
                    });
                    if (catalog.bright_stars) {
                        catalog.bright_stars.forEach((s) => {
                            if (s.name && Number(s.mag || 3.0) <= 2.2) {
                                const p = projectRaDecToCanvas(s.ra, s.dec);
                                if (p.visible) drawLabel(s.name, p.x + lp(LABEL_STYLE.starDx), p.y + lp(LABEL_STYLE.starDy), LABEL_STYLE.starPx, LABEL_STYLE.starWeight, LABEL_STYLE.starFill, "left", 0);
                            }
                        });
                    }
                    ctx.restore();
                }

                // 3b. Deep-sky objects (Messier), independent of sky_labels
                if (showDso && catalog.messier) {
                    ctx.save();
                    catalog.messier.forEach((o) => {
                        const p = projectRaDecToCanvas(o.ra, o.dec);
                        if (!p.visible) return;
                        const r = lp(LABEL_STYLE.dsoR);
                        ctx.lineWidth = lp(1.5);
                        ctx.strokeStyle = nightLabel(LABEL_STYLE.dsoFill);
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, r, 0, 2 * Math.PI);
                        ctx.stroke();
                        drawLabel(o.id, p.x + r + lp(4), p.y, LABEL_STYLE.dsoPx, LABEL_STYLE.dsoWeight, LABEL_STYLE.dsoFill, "left", 0);
                    });
                    ctx.restore();
                }

                // 4. Sun & Moon Tracking
                if (showSunMoon) {
                    const sm = sunMoonEquatorial(nowUtc);
                    const bodies = [
                        { key: "sun", label: "Sun", pos: sm.sun, ring: TK("--c-warn"), text: TK("--c-text"), r: 13 },
                        { key: "moon", label: `Moon ${Math.round(sm.moon.illum * 100)}%`, pos: sm.moon, ring: TK("--c-text"), text: TK("--c-text"), r: 10 },
                    ];
                    ctx.save();
                    ctx.font = "bold 15px Inter, system-ui, sans-serif";
                    ctx.textAlign = "left";
                    bodies.forEach((b) => {
                        const pt = projectRaDecToCanvas(b.pos.ra, b.pos.dec);
                        if (!pt.visible) return;
                        ctx.strokeStyle = isNight ? TK("--c-danger") : b.ring;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, b.r, 0, 2 * Math.PI);
                        ctx.stroke();
                        ctx.fillStyle = isNight ? TK("--c-danger") : b.text;
                        ctx.shadowColor = "rgba(0, 0, 0, 0.95)";
                        ctx.shadowBlur = 4;
                        ctx.fillText(`${b.label} (${pt.alt.toFixed(0)}°)`, pt.x + b.r + 8, pt.y + 5);
                        ctx.shadowBlur = 0;
                    });
                    ctx.restore();

                    // Naked-eye planets (server alt/az, refreshed every 60 s)
                    ctx.save();
                    skyBodies.forEach((b) => {
                        if (b.alt <= 0) return;
                        const pt = projectAltAzToCanvas(b.alt, b.az);
                        if (!pt.visible) return;
                        const r = lp(LABEL_STYLE.planetDot);
                        ctx.fillStyle = nightLabel(LABEL_STYLE.planetFill);
                        ctx.strokeStyle = LABEL_STYLE.outline;
                        ctx.lineWidth = lp(LABEL_STYLE.outlinePx);
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, r, 0, 2 * Math.PI);
                        ctx.stroke();
                        ctx.fill();
                        drawLabel(b.name, pt.x + r + lp(5), pt.y, LABEL_STYLE.planetPx, LABEL_STYLE.planetWeight, LABEL_STYLE.planetFill, "left", 0);
                    });
                    ctx.restore();
                }

                // 5. Recent Meteor / Plane Streaks Overlay

                if (showEvents && recentEvents.length > 0) {
                    ctx.save();
                    recentEvents.slice(0, 12).forEach((ev) => {
                        if (!Array.isArray(ev.line) || ev.line.length < 4) return;
                        const x1 = offsetX + (mirrorX ? 1 - ev.line[0] : ev.line[0]) * renderW;
                        const y1 = offsetY + (mirrorY ? 1 - ev.line[1] : ev.line[1]) * renderH;
                        const x2 = offsetX + (mirrorX ? 1 - ev.line[2] : ev.line[2]) * renderW;
                        const y2 = offsetY + (mirrorY ? 1 - ev.line[3] : ev.line[3]) * renderH;

                        const isMeteor = ev.type === "meteor";
                        const strokeCol = isMeteor ? TK("--c-warn") : ev.type === "satellite" ? TK("--c-violet") : TK("--c-accent");

                        ctx.strokeStyle = strokeCol;
                        ctx.lineWidth = isMeteor ? 2.5 : 1.8;
                        ctx.setLineDash(isMeteor ? [] : [5, 4]);
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        ctx.fillStyle = strokeCol;
                        ctx.beginPath();
                        ctx.arc(x2, y2, 3.5, 0, 2 * Math.PI);
                        ctx.fill();

                        const tag = isMeteor
                            ? `☄️ Meteor`
                            : `✈️ ${(ev.flight && ev.flight.callsign) || (ev.nearest_flight && ev.nearest_flight.callsign) || "Plane"}`;
                        ctx.font = "bold 12px monospace";
                        ctx.shadowColor = "rgba(0, 0, 0, 1)";
                        ctx.shadowBlur = 4;
                        ctx.fillText(tag, x2 + 6, y2 - 4);
                        ctx.shadowBlur = 0;
                    });
                    ctx.restore();
                }

                // 6. Live ADS-B Aircraft Radar Overlay
                if (showAdsb && liveAircraft.length > 0) {
                    ctx.save();
                    let drawnInSky = 0;
                    liveAircraft.forEach((ac) => {
                        if (ac.alt_deg === undefined || ac.az_deg === undefined) return;
                        const pt = projectAltAzToCanvas(ac.alt_deg, ac.az_deg);
                        if (!pt.visible) return;
                        drawnInSky++;
                        const call = ac.callsign || ac.icao || "ACFT";
                        const altKm = ac.altitude_m ? `${(ac.altitude_m / 1000).toFixed(1)}km` : "";
                        const distKm = ac.distance_km ? `${Number(ac.distance_km).toFixed(0)}km` : "";

                        ctx.strokeStyle = TK("--c-ok");
                        ctx.fillStyle = TK("--c-ok");
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, 6, 0, 2 * Math.PI);
                        ctx.stroke();

                        ctx.font = "bold 13px monospace";
                        ctx.shadowColor = "rgba(0,0,0,0.95)";
                        ctx.shadowBlur = 4;
                        ctx.fillStyle = TK("--c-ok");
                        ctx.fillText(`✈ ${call} ${altKm} (${distKm})`, pt.x + 10, pt.y + 4);
                        ctx.shadowBlur = 0;
                    });

                    // Compact ADS-B radar box at top-right (below OBS datetime) if no PiP active
                    if (replayPip.style.display === "none") {
                        const topList = liveAircraft.slice(0, 5);
                        const boxW = 285;
                        const boxH = 26 + topList.length * 20;
                        const bx = w - boxW - 16;
                        const by = 66;
                        ctx.fillStyle = "rgba(2, 6, 23, 0.78)";
                        ctx.strokeStyle = "rgba(16, 185, 129, 0.45)";
                        ctx.lineWidth = 1.2;
                        ctx.fillRect(bx, by, boxW, boxH);
                        ctx.strokeRect(bx, by, boxW, boxH);

                        ctx.fillStyle = TK("--c-ok");
                        ctx.font = "bold 12px monospace";
                        ctx.fillText(`✈ ADS-B RADAR (${liveAircraft.length} aircraft • ${drawnInSky} in FOV)`, bx + 8, by + 17);

                        ctx.fillStyle = TK("--c-text");
                        ctx.font = "12px monospace";
                        topList.forEach((ac, idx) => {
                            const call = (ac.callsign || ac.icao || "---").padEnd(8, " ");
                            const alt = ac.altitude_m ? `${Math.round(ac.altitude_m)}m`.padStart(6, " ") : "   --m";
                            const dist = ac.distance_km ? `${Number(ac.distance_km).toFixed(0)}km`.padStart(5, " ") : " --km";
                            const el = ac.alt_deg !== undefined ? `cao ${Math.round(ac.alt_deg)}°` : "";
                            ctx.fillText(`${call} ${alt} ${dist} ${el}`, bx + 8, by + 35 + idx * 20);
                        });
                    }
                    ctx.restore();
                }

                // 7. Astrometry Info Badge
                if (showBadge) {
                    ctx.save();
                    const zTxt = overlayState.zoom && overlayState.zoom !== 1 ? ` • Zoom ${Number(overlayState.zoom).toFixed(1)}x` : "";
                    const badgeText = `LST ${formatLstHms(lmstDeg)} • ${isRectilinear ? `FOV ${hfovDeg.toFixed(1)}°` : `R90=${r90SensorPx.toFixed(0)}px`} • PA=${northPaDeg.toFixed(1)}°${zTxt}`;
                    ctx.font = "bold 13px monospace";
                    const bw = ctx.measureText(badgeText).width + 18;
                    const bx = 12;
                    const by = 12;
                    ctx.fillStyle = colors.badgeBg;
                    ctx.strokeStyle = colors.badgeBorder;
                    ctx.lineWidth = 1.2;
                    ctx.fillRect(bx, by, bw, 26);
                    ctx.strokeRect(bx, by, bw, 26);
                    ctx.fillStyle = colors.badgeText;
                    ctx.textAlign = "left";
                    ctx.fillText(badgeText, bx + 9, by + 17);
                    ctx.restore();
                }

                ctx.restore();
            }

            // Interactive mouse wheel zoom & drag pan on /obs page (synced back to server & dock)
            let dragging = false;
            let dragStartX = 0, dragStartY = 0;
            let syncViewTimer = null;
            function syncViewToServer() {
                if (syncViewTimer) clearTimeout(syncViewTimer);
                syncViewTimer = setTimeout(() => {
                    syncViewTimer = null;
                    fetch("/api/obs/overlay", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            zoom: overlayState.zoom,
                            pan_x: overlayState.pan_x,
                            pan_y: overlayState.pan_y,
                        }),
                    }).catch((err) => console.error("[OBS:Viewport] Failed to sync zoom/pan:", err));
                }, 80);
            }
            stage.addEventListener("wheel", (e) => {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.2 : -0.2;
                overlayState.zoom = Math.max(0.5, Math.min(8.0, Number((overlayState.zoom + delta).toFixed(2))));
                if (overlayState.zoom === 1.0) { overlayState.pan_x = 0; overlayState.pan_y = 0; }
                applyOverlaySettings();
                syncViewToServer();
            }, { passive: false });

            stage.addEventListener("mousedown", (e) => {
                if (e.button !== 0) return;
                dragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
            });
            window.addEventListener("mousemove", (e) => {
                if (!dragging) return;
                const dx = ((e.clientX - dragStartX) / Math.max(1, stage.clientWidth)) * 100;
                const dy = ((e.clientY - dragStartY) / Math.max(1, stage.clientHeight)) * 100;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                overlayState.pan_x = Math.max(-100, Math.min(100, Number((overlayState.pan_x + dx).toFixed(1))));
                overlayState.pan_y = Math.max(-100, Math.min(100, Number((overlayState.pan_y + dy).toFixed(1))));
                applyOverlaySettings();
                syncViewToServer();
            });
            window.addEventListener("mouseup", () => { dragging = false; });

            function swapFrameBlob(blob) {
                const nextUrl = URL.createObjectURL(blob);
                const prevUrl = activeObjectUrl;
                activeObjectUrl = nextUrl;

                img.onload = function () {
                    if (prevUrl && prevUrl !== nextUrl) {
                        URL.revokeObjectURL(prevUrl);
                    }
                    if (overlayState.view_mode === "live") drawReticle();
                };
                img.onerror = function () {
                    if (activeObjectUrl === nextUrl) {
                        URL.revokeObjectURL(nextUrl);
                        activeObjectUrl = prevUrl;
                    }
                };
                img.src = nextUrl;
            }

            function renderAsb1Packet(buf) {
                if (!buf || buf.byteLength < ASB1_HEADER_TOTAL) return;
                const dv = new DataView(buf);
                if (
                    dv.getUint8(0) !== 0x41 ||
                    dv.getUint8(1) !== 0x53 ||
                    dv.getUint8(2) !== 0x42 ||
                    dv.getUint8(3) !== 0x31
                ) {
                    return;
                }
                const frameTs = dv.getFloat64(8, true);
                const jpegLen = dv.getUint32(88, true);
                if (jpegLen === 0 || buf.byteLength < ASB1_HEADER_TOTAL + jpegLen) {
                    return;
                }
                if (frameTs > 0 && frameTs === lastFrameTs) {
                    return;
                }
                lastFrameTs = frameTs;

                const jpegView = new Uint8Array(buf, ASB1_HEADER_TOTAL, jpegLen);
                const blob = new Blob([jpegView], { type: "image/jpeg" });
                swapFrameBlob(blob);
            }

            function scheduleReconnect(delayMs) {
                if (reconnectTimer) return;
                reconnectTimer = setTimeout(function () {
                    reconnectTimer = null;
                    connectWebSocket();
                }, delayMs);
            }

            function connectWebSocket() {
                if (ws) {
                    try { ws.close(); } catch (err) {}
                    ws = null;
                }
                const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
                const fullParam = (useFullRes ? "&full=1" : "") + "&v=2";
                const wsUrl = proto + "//" + window.location.host + "/ws/live?binary=1" + fullParam;
                try {
                    const sock = new WebSocket(wsUrl);
                    ws = sock;
                    ws.binaryType = "arraybuffer";

                    ws.onmessage = function (ev) {
                        if (ev.data instanceof ArrayBuffer) {
                            renderAsb1Packet(ev.data);
                        } else if (typeof ev.data === "string") {
                            try {
                                const msg = JSON.parse(ev.data);
                                if (msg.type === "obs_overlay" && msg.settings) {
                                    applyOverlaySettings(msg.settings);
                                } else if (msg.type === "obs_reload") {
                                    window.location.reload();
                                }
                            } catch (e) {}
                        }
                    };

                    ws.onclose = function () {
                        if (ws !== sock) return;   // replaced on purpose (size change): the new socket owns the state
                        ws = null;
                        lastFrameTs = -1;
                        if (activeObjectUrl) {
                            URL.revokeObjectURL(activeObjectUrl);
                            activeObjectUrl = null;
                        }
                        setMjpegSrc();
                        scheduleReconnect(2000);
                    };
                } catch (err) {
                    setMjpegSrc();
                    scheduleReconnect(3000);
                }
            }

            // Guest MJPEG ends cleanly after ~10 min (no error event): re-set src with a cache-buster before that
            let mjpegRefreshTimer = null;
            function setMjpegSrc() {
                if (mjpegRefreshTimer && img.src.includes("/api/stream/mjpeg")) return;
                img.src = "/api/stream/mjpeg?t=" + Date.now();
                if (mjpegRefreshTimer) clearInterval(mjpegRefreshTimer);
                mjpegRefreshTimer = setInterval(() => {
                    if (img.src.includes("/api/stream/mjpeg")) img.src = "/api/stream/mjpeg?t=" + Date.now();
                    else { clearInterval(mjpegRefreshTimer); mjpegRefreshTimer = null; }
                }, 9 * 60 * 1000);
            }

            fetch("/api/station/config")
                .then((r) => r.json())
                .then((cfg) => {
                    if (cfg && typeof cfg === "object") {
                        stationConfig = cfg;
                        stationLoaded = true;
                        drawReticle();
                    }
                })
                .catch(() => {});

            function fetchOverlaySettings() {
                fetch("/api/obs/overlay")
                    .then((r) => r.json())
                    .then((settings) => {
                        if (!dragging && !syncViewTimer) applyOverlaySettings(settings);
                    })
                    .catch((err) => console.error("[OBS:Overlay] Poll error:", err));
            }
            fetchOverlaySettings();
            setInterval(fetchOverlaySettings, 2000);

            window.addEventListener("resize", drawReticle);
            setInterval(drawReticle, 5000);

            img.src = "/api/live/snapshot.jpg?t=" + Date.now();
            connectWebSocket();
        })();
    </script>
</body>
</html>

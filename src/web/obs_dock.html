<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>AllSky OBS Studio Control Dock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="/static/tokens.css?v=20261026ns1">
    <script>try{if(JSON.parse(localStorage.getItem("allsky.ui.prefs.v1")||"{}").nightVision)document.documentElement.setAttribute("data-theme","red")}catch(e){}</script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 16px;
            line-height: 1.35;
            padding: 8px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* Header */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 7px 10px;
            margin-bottom: 8px;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }
        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: var(--amber);
            flex-shrink: 0;
        }
        .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot.offline { background: var(--red); }
        .title {
            font-weight: 900;
            font-size: 17px;
            color: #fff;
            white-space: nowrap;
        }
        .telem-mini {
            color: #cbd5e1;
            font-family: ui-monospace, monospace;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar-actions {
            display: flex;
            gap: 5px;
            flex-shrink: 0;
        }

        /* Compact Card */
        .box {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 8px;
        }
        .box-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 0.4px;
            margin-bottom: 7px;
        }

        /* Buttons */
        button {
            background: var(--input);
            border: 1.5px solid var(--border);
            color: #ffffff;
            border-radius: 6px;
            padding: 7px 9px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.1s, border-color 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            white-space: nowrap;
        }
        button:hover {
            background: var(--hover);
            border-color: var(--accent);
        }
        button:active {
            transform: translateY(1px);
        }
        button.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #060911;
            font-weight: 900;
        }
        button.btn-live {
            background: rgba(239, 68, 68, 0.25);
            border-color: var(--red);
            color: #fecaca;
        }
        button.btn-live.active {
            background: var(--red);
            color: #fff;
        }
        button.btn-sm {
            padding: 5px 8px;
            font-size: 14px;
            font-weight: 800;
        }

        /* Grids */
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 5px;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }
        .row:first-child { margin-top: 0; }
        .lbl {
            font-size: 14px;
            font-weight: 800;
            color: #e2e8f0;
            min-width: 52px;
            flex-shrink: 0;
        }
        .val {
            font-family: ui-monospace, monospace;
            font-size: 15px;
            font-weight: 900;
            color: var(--accent);
            min-width: 46px;
            text-align: right;
            flex-shrink: 0;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            accent-color: var(--accent);
            cursor: pointer;
            min-width: 45px;
        }
        input[type="text"], input[type="number"], select {
            background: var(--input);
            border: 1.5px solid var(--border);
            color: #ffffff;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 15px;
            font-weight: 700;
            outline: none;
            user-select: text;
            -webkit-user-select: text;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: var(--accent);
        }

        /* Events & Replay List */
        .ev-list {
            max-height: 230px;
            overflow-y: auto;
            margin-top: 6px;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            background: #0d111a;
        }
        .ev-item {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            font-size: 15px;
        }
        .ev-item:last-child { border-bottom: none; }
        .ev-item:hover { background: var(--hover); }
        .ev-item.active {
            background: var(--accent-bg);
            border-left: 4px solid var(--accent);
        }
        .ev-thumb {
            width: 46px;
            height: 34px;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
            flex-shrink: 0;
        }
        .ev-info {
            flex: 1;
            min-width: 0;
        }
        .ev-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            font-weight: 800;
            font-size: 15px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ev-sub {
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ev-empty {
            padding: 16px;
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: var(--green);
            color: #041f14;
            font-size: 14px;
            font-weight: 900;
            padding: 6px 12px;
            border-radius: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
            z-index: 99;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <!-- 1. Top Bar -->
    <div class="topbar">
        <div class="topbar-left">
            <span id="status-dot" class="dot" title="Connection status"></span>
            <span class="title">AllSky OBS</span>
            <a href="/live" class="btn-sm" title="Back to dashboard" style="text-decoration:none">← Dashboard</a>
            <span id="telem-summary" class="telem-mini">--ms • --dB</span>
        </div>
        <div class="topbar-actions">
            <button id="btn-go-live" class="btn-live active" title="Back to live camera feed">🔴 LIVE</button>
            <button id="btn-snap" class="btn-sm" title="Refresh OBS Browser Source">🔄 Reload OBS</button>
            <button id="btn-open-obs" class="btn-sm" title="Open /obs page">↗</button>
        </div>
    </div>

    <!-- 2. Source & Overlays -->
    <div class="box">
        <div class="box-head">
            <span>Display &amp; Source</span>
            <span id="lbl-lst" style="font-family:monospace;font-size:14px;color:#fff">LST --:--:--</span>
        </div>

        <!-- Source mode -->
        <div class="grid-4" style="margin-bottom: 6px;">
            <button type="button" class="mode-btn active" data-mode="live">🔴 Live</button>
            <button type="button" class="mode-btn" data-mode="timelapse">🎬 Timelapse</button>
            <button type="button" class="mode-btn" data-mode="startrails">🌀 Startrails</button>
            <button type="button" class="mode-btn" data-mode="keogram">📊 Keogram</button>
        </div>

        <!-- 8 quick toggles -->
        <div class="grid-4" style="margin-bottom: 6px;">
            <button type="button" id="tg-sky" title="Constellations & bright stars">🌟 Constellations</button>
            <button type="button" id="tg-labels" title="Constellation & star names">🏷️ Star names</button>
            <button type="button" id="tg-grid" title="Coordinate grid & compass">🧭 Grid/Compass</button>
            <button type="button" id="tg-sunmoon" title="Sun & Moon position">☀️ Sun/Moon</button>
            <button type="button" id="tg-adsb" title="Live ADS-B aircraft radar">✈️ ADS-B Radar</button>
            <button type="button" id="tg-events" title="Recent meteor & aircraft trails">☄️ Event trails</button>
            <button type="button" id="tg-badge" title="Left-corner info badge">📊 LST/FOV</button>
            <button type="button" id="tg-night" title="Red tint to protect night vision">🔴 Red light</button>
        </div>

        <!-- Presets + Fit/Bg + Opacity -->
        <div class="row">
            <button type="button" id="pre-full" class="btn-sm" style="flex:1">🌌 Full</button>
            <button type="button" id="pre-clean" class="btn-sm" style="flex:1">🔭 Clean</button>
            <button type="button" id="pre-raw" class="btn-sm" style="flex:1">📷 Raw</button>
            <button type="button" id="btn-fit" class="btn-sm" style="flex:1" title="Toggle 16:9 Cover / 4:3 Original">16:9 Cover</button>
            <button type="button" id="btn-bg" class="btn-sm" title="Toggle Black / Transparent background">Black BG</button>
        </div>
        <div class="row">
            <span class="lbl">Sharpness:</span>
            <input type="range" id="rng-opacity" min="0.1" max="1.0" step="0.05" value="1.0">
            <span id="val-opacity" class="val">100%</span>
        </div>
    </div>

    <!-- 3. Zoom, Pan, Tilt/Rotate & Brightness -->
    <div class="box">
        <div class="box-head">
            <span>Zoom • Pan • Tilt (Xoay)</span>
            <button type="button" id="btn-reset-view" class="btn-sm">⟲ Reset khung</button>
        </div>

        <!-- Zoom -->
        <div class="row">
            <span class="lbl">Zoom:</span>
            <input type="range" id="rng-zoom" min="1.0" max="6.0" step="0.1" value="1.0">
            <span id="val-zoom" class="val">1.0x</span>
            <button type="button" class="btn-sm z-quick" data-z="1">1x</button>
            <button type="button" class="btn-sm z-quick" data-z="2">2x</button>
            <button type="button" class="btn-sm z-quick" data-z="4">4x</button>
        </div>

        <!-- Pan X / Y + direction buttons -->
        <div class="row">
            <span class="lbl">Pan:</span>
            <button type="button" class="btn-sm pan-step" data-dx="-8" data-dy="0" title="Left">◀</button>
            <button type="button" class="btn-sm pan-step" data-dx="0" data-dy="-8" title="Up">▲</button>
            <button type="button" class="btn-sm pan-step" data-dx="0" data-dy="8" title="Down">▼</button>
            <button type="button" class="btn-sm pan-step" data-dx="8" data-dy="0" title="Right">▶</button>
            <button type="button" class="btn-sm" id="btn-pan-center" title="Center">⏺</button>
            <input type="range" id="rng-panx" min="-80" max="80" step="1" value="0" title="Pan ngang (X)">
            <input type="range" id="rng-pany" min="-80" max="80" step="1" value="0" title="Pan vertical (Y)">
        </div>

        <!-- Tilt / Rotate + Flip -->
        <div class="row">
            <span class="lbl">Xoay:</span>
            <input type="range" id="rng-rotate" min="-180" max="180" step="1" value="0">
            <span id="val-rotate" class="val">0°</span>
            <button type="button" class="btn-sm rot-quick" data-r="0">0°</button>
            <button type="button" class="btn-sm rot-quick" data-r="90">90°</button>
            <button type="button" class="btn-sm rot-quick" data-r="180">180°</button>
            <button type="button" id="btn-fliph" class="btn-sm" title="Flip horizontal">⇄H</button>
            <button type="button" id="btn-flipv" class="btn-sm" title="Flip vertical">⇅V</button>
        </div>

        <!-- Brightness & Contrast -->
        <div class="row">
            <span class="lbl">Bright:</span>
            <input type="range" id="rng-bright" min="0.5" max="2.5" step="0.05" value="1.0">
            <span id="val-bright" class="val" style="min-width:36px">1.0</span>
            <span class="lbl" style="min-width:46px;margin-left:4px">Contrast:</span>
            <input type="range" id="rng-contrast" min="0.5" max="2.5" step="0.05" value="1.0">
            <span id="val-contrast" class="val" style="min-width:36px">1.0</span>
        </div>
    </div>

    <!-- 4. OBS Title -->
    <div class="box">
        <div class="box-head">
            <span>OBS Title</span>
            <select id="sel-title-pos" style="padding:3px 6px;font-size:14px;">
                <option value="bottom-left">Bottom left</option>
                <option value="bottom-center">Bottom center</option>
                <option value="top-left">Top left</option>
                <option value="top-center">Top center</option>
            </select>
        </div>
        <div class="row">
            <input type="text" id="inp-title" placeholder="Main title..." style="flex:1.2;min-width:0;">
            <input type="text" id="inp-sub" placeholder="Subtitle..." style="flex:1;min-width:0;">
            <button type="button" id="btn-title-apply" class="btn-sm active">Show</button>
            <button type="button" id="btn-title-clear" class="btn-sm">Clear</button>
        </div>
    </div>

    <!-- 5. Replay Meteors, Aircraft, Satellites & ADS-B Radar -->
    <div class="box">
        <div class="box-head">
            <span>Replay Meteors • Aircraft • Radar</span>
            <div style="display:flex;gap:5px;">
                <button type="button" id="btn-ev-prev" class="btn-sm" title="Previous event">◀</button>
                <button type="button" id="btn-ev-next" class="btn-sm" title="Next event">▶</button>
                <button type="button" id="btn-ev-reload" class="btn-sm" title="Reload list">🔄</button>
            </div>
        </div>

        <div class="grid-4" id="ev-tabs">
            <button type="button" class="ev-tab active" data-tab="all">All</button>
            <button type="button" class="ev-tab" data-tab="meteor">☄️ Meteors</button>
            <button type="button" class="ev-tab" data-tab="plane">✈️ Aircraft</button>
            <button type="button" class="ev-tab" data-tab="adsb">📡 Radar Live</button>
        </div>

        <div id="ev-list" class="ev-list">
            <div class="ev-empty">Loading data...</div>
        </div>
    </div>

    <!-- 6. Quick Camera Controls -->
    <div class="box" style="margin-bottom:0;">
        <div class="box-head">
            <span>Camera &amp; Exposure</span>
            <span id="cam-sky-info" style="color:#fff;font-size:13px;font-weight:800">--</span>
        </div>
        <div class="row">
            <button type="button" id="cam-auto" class="btn-sm" style="flex:1">Auto AE</button>
            <button type="button" id="cam-manual" class="btn-sm" style="flex:1">Manual</button>
            <button type="button" id="cam-boost" class="btn-sm" style="flex:1">✨ Star Boost</button>
        </div>
        <div class="row">
            <span class="lbl">Exp(s):</span>
            <input type="number" id="inp-exp" step="any" min="0.0001" max="90" value="0.01" style="width:82px">
            <span class="lbl" style="min-width:44px">Gain:</span>
            <input type="number" id="inp-gain" step="1" min="0" max="72" value="0" style="width:66px">
            <button type="button" id="btn-cam-set" class="btn-sm" style="flex:1">Apply</button>
        </div>
    </div>

    <div id="toast" class="toast">Synced</div>

    <script>
        (function () {
            const $ = (id) => document.getElementById(id);
            const statusDot = $("status-dot");
            const telemSummary = $("telem-summary");
            const lblLst = $("lbl-lst");
            const toast = $("toast");

            let state = {
                sky_overlay: false,
                sky_labels: false,
                grid_overlay: false,
                sun_moon: true,
                badge: true,
                adsb_overlay: false,
                events_overlay: false,
                fit: "cover",
                bg: "black",
                night_vision: false,
                opacity: 1.0,
                zoom: 1.0,
                pan_x: 0.0,
                pan_y: 0.0,
                rotate: 0.0,
                flip_h: false,
                flip_v: false,
                brightness: 1.0,
                contrast: 1.0,
                title_text: "",
                title_sub: "",
                title_pos: "bottom-left",
                view_mode: "live",
                replay_url: "",
                replay_crop_url: "",
                replay_label: "",
            };

            let stationLon = 105.8542;
            let currentTab = "all";
            let eventsList = [];
            let adsbList = [];
            let selectedEventIdx = -1;
            let starBoostOn = false;

            let lastSliderDragTs = 0;
            let pendingPatch = {};
            let patchTimer = null;
            let inFlight = false;

            function notify(msg) {
                toast.textContent = msg;
                toast.classList.add("show");
                clearTimeout(toast._t);
                toast._t = setTimeout(() => toast.classList.remove("show"), 1200);
            }

            function syncUI(s, fromServer = false) {
                if (s) {
                    if (fromServer && Date.now() - lastSliderDragTs < 700) {
                        const { zoom, pan_x, pan_y, rotate, brightness, contrast, opacity, ...rest } = s;
                        Object.assign(state, rest);
                    } else {
                        Object.assign(state, s);
                    }
                }

                $("btn-go-live").classList.toggle("active", state.view_mode === "live");
                document.querySelectorAll(".mode-btn").forEach((b) => {
                    b.classList.toggle("active", b.dataset.mode === state.view_mode);
                });

                $("tg-sky").classList.toggle("active", !!state.sky_overlay);
                $("tg-labels").classList.toggle("active", !!state.sky_labels);
                $("tg-grid").classList.toggle("active", !!state.grid_overlay);
                $("tg-sunmoon").classList.toggle("active", state.sun_moon !== false);
                $("tg-adsb").classList.toggle("active", !!state.adsb_overlay);
                $("tg-events").classList.toggle("active", !!state.events_overlay);
                $("tg-badge").classList.toggle("active", state.badge !== false);
                $("tg-night").classList.toggle("active", !!state.night_vision);

                $("btn-fit").textContent = state.fit === "contain" ? "4:3 Original" : "16:9 Cover";
                $("btn-fit").classList.toggle("active", state.fit === "contain");
                $("btn-bg").textContent = state.bg === "transparent" ? "Alpha" : "Black BG";
                $("btn-bg").classList.toggle("active", state.bg === "transparent");

                if (!fromServer || Date.now() - lastSliderDragTs >= 700) {
                    $("rng-opacity").value = state.opacity ?? 1.0;
                    $("val-opacity").textContent = Math.round((state.opacity ?? 1.0) * 100) + "%";

                    $("rng-zoom").value = state.zoom ?? 1.0;
                    $("val-zoom").textContent = Number(state.zoom ?? 1.0).toFixed(1) + "x";
                    $("rng-panx").value = state.pan_x ?? 0;
                    $("rng-pany").value = state.pan_y ?? 0;
                    $("rng-rotate").value = state.rotate ?? 0;
                    $("val-rotate").textContent = Math.round(state.rotate ?? 0) + "°";

                    $("rng-bright").value = state.brightness ?? 1.0;
                    $("val-bright").textContent = Number(state.brightness ?? 1.0).toFixed(2);
                    $("rng-contrast").value = state.contrast ?? 1.0;
                    $("val-contrast").textContent = Number(state.contrast ?? 1.0).toFixed(2);
                }

                $("btn-fliph").classList.toggle("active", !!state.flip_h);
                $("btn-flipv").classList.toggle("active", !!state.flip_v);

                if (document.activeElement !== $("inp-title")) $("inp-title").value = state.title_text || "";
                if (document.activeElement !== $("inp-sub")) $("inp-sub").value = state.title_sub || "";
                $("sel-title-pos").value = state.title_pos || "bottom-left";
            }

            async function flushPatch(msg) {
                if (inFlight || Object.keys(pendingPatch).length === 0) return;
                inFlight = true;
                const body = pendingPatch;
                pendingPatch = {};
                try {
                    const r = await fetch("/api/obs/overlay", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body),
                    });
                    if (r.ok) {
                        const d = await r.json();
                        if (d.settings) syncUI(d.settings, true);
                        if (msg) notify(msg);
                    }
                } catch (e) {
                    console.error("[OBS:Dock] Patch failed:", e);
                } finally {
                    inFlight = false;
                    if (Object.keys(pendingPatch).length > 0) {
                        flushPatch();
                    }
                }
            }

            function pushPatch(patch, msg, isSlider = false) {
                if (isSlider) lastSliderDragTs = Date.now();
                Object.assign(state, patch);
                Object.assign(pendingPatch, patch);
                syncUI();
                if (isSlider) {
                    if (!patchTimer) {
                        patchTimer = setTimeout(() => {
                            patchTimer = null;
                            flushPatch(msg);
                        }, 40);
                    }
                } else {
                    if (patchTimer) {
                        clearTimeout(patchTimer);
                        patchTimer = null;
                    }
                    flushPatch(msg);
                }
            }

            // Topbar buttons
            $("btn-go-live").addEventListener("click", () => {
                selectedEventIdx = -1;
                renderEventRows();
                pushPatch({ view_mode: "live", replay_url: "", replay_crop_url: "", replay_label: "" }, "Playing LIVE");
            });
            $("btn-snap").addEventListener("click", () => {
                fetch("/api/obs/reload", { method: "POST" }).catch((err) => console.error("[OBS:Dock] Reload failed:", err));
                notify("OBS refreshed");
            });
            $("btn-open-obs").addEventListener("click", () => window.open("/obs", "_blank"));

            // View Mode buttons
            document.querySelectorAll(".mode-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const m = btn.dataset.mode;
                    if (m === "live") {
                        selectedEventIdx = -1;
                        renderEventRows();
                        pushPatch({ view_mode: "live", replay_url: "", replay_crop_url: "", replay_label: "" }, "LIVE mode");
                    } else if (m === "timelapse") {
                        pushPatch({ view_mode: "timelapse", replay_url: "/uploads/allsky/timelapses/latest.mp4", replay_label: "🎬 TODAY TIMELAPSE" }, "Playing Timelapse");
                    } else if (m === "startrails") {
                        pushPatch({ view_mode: "startrails", replay_url: "/uploads/allsky/startrails/latest.jpg", replay_label: "🌀 STARTRAILS" }, "Showing Startrails");
                    } else if (m === "keogram") {
                        pushPatch({ view_mode: "keogram", replay_url: "/uploads/allsky/keograms/latest.jpg", replay_label: "📊 KEOGRAM" }, "Showing Keogram");
                    }
                });
            });

            // 8 Overlay Toggles
            const bindToggle = (id, key) => {
                $(id).addEventListener("click", () => pushPatch({ [key]: !state[key] }));
            };
            bindToggle("tg-sky", "sky_overlay");
            bindToggle("tg-labels", "sky_labels");
            bindToggle("tg-grid", "grid_overlay");
            bindToggle("tg-sunmoon", "sun_moon");
            bindToggle("tg-adsb", "adsb_overlay");
            bindToggle("tg-events", "events_overlay");
            bindToggle("tg-badge", "badge");
            bindToggle("tg-night", "night_vision");

            // Presets & Fit/Bg
            $("pre-full").addEventListener("click", () => pushPatch({
                sky_overlay: true, sky_labels: true, grid_overlay: true, sun_moon: true, adsb_overlay: true, events_overlay: true, badge: true
            }, "Preset: Full"));
            $("pre-clean").addEventListener("click", () => pushPatch({
                sky_overlay: true, sky_labels: false, grid_overlay: false, sun_moon: true, adsb_overlay: false, events_overlay: false, badge: false
            }, "Preset: Stargazing"));
            $("pre-raw").addEventListener("click", () => pushPatch({
                sky_overlay: false, sky_labels: false, grid_overlay: false, sun_moon: false, adsb_overlay: false, events_overlay: false, badge: false
            }, "Preset: Raw video"));

            $("btn-fit").addEventListener("click", () => pushPatch({ fit: state.fit === "contain" ? "cover" : "contain" }));
            $("btn-bg").addEventListener("click", () => pushPatch({ bg: state.bg === "transparent" ? "black" : "transparent" }));

            const bindRange = (id, key) => {
                const el = $(id);
                const handler = (e) => pushPatch({ [key]: parseFloat(e.target.value) }, null, true);
                el.addEventListener("input", handler);
                el.addEventListener("change", handler);
            };
            bindRange("rng-opacity", "opacity");
            bindRange("rng-zoom", "zoom");
            document.querySelectorAll(".z-quick").forEach((b) => {
                b.addEventListener("click", () => {
                    const z = parseFloat(b.dataset.z);
                    pushPatch(z === 1 ? { zoom: 1.0, pan_x: 0, pan_y: 0 } : { zoom: z });
                });
            });

            document.querySelectorAll(".pan-step").forEach((b) => {
                b.addEventListener("click", () => {
                    const nx = Math.max(-80, Math.min(80, (state.pan_x || 0) + parseFloat(b.dataset.dx)));
                    const ny = Math.max(-80, Math.min(80, (state.pan_y || 0) + parseFloat(b.dataset.dy)));
                    pushPatch({ pan_x: nx, pan_y: ny });
                });
            });
            $("btn-pan-center").addEventListener("click", () => pushPatch({ pan_x: 0, pan_y: 0 }));
            bindRange("rng-panx", "pan_x");
            bindRange("rng-pany", "pan_y");

            bindRange("rng-rotate", "rotate");
            document.querySelectorAll(".rot-quick").forEach((b) => {
                b.addEventListener("click", () => pushPatch({ rotate: parseFloat(b.dataset.r) }));
            });
            $("btn-fliph").addEventListener("click", () => pushPatch({ flip_h: !state.flip_h }));
            $("btn-flipv").addEventListener("click", () => pushPatch({ flip_v: !state.flip_v }));

            bindRange("rng-bright", "brightness");
            bindRange("rng-contrast", "contrast");

            $("btn-reset-view").addEventListener("click", () => {
                pushPatch({
                    zoom: 1.0, pan_x: 0.0, pan_y: 0.0, rotate: 0.0,
                    flip_h: false, flip_v: false, brightness: 1.0, contrast: 1.0
                }, "Frame reset");
            });

            // Title Controls
            const applyTitle = () => {
                pushPatch({
                    title_text: $("inp-title").value.trim(),
                    title_sub: $("inp-sub").value.trim(),
                    title_pos: $("sel-title-pos").value,
                }, "Title updated");
            };
            $("btn-title-apply").addEventListener("click", applyTitle);
            $("inp-title").addEventListener("keydown", (e) => { if (e.key === "Enter") applyTitle(); });
            $("inp-sub").addEventListener("keydown", (e) => { if (e.key === "Enter") applyTitle(); });
            $("sel-title-pos").addEventListener("change", applyTitle);
            $("btn-title-clear").addEventListener("click", () => {
                $("inp-title").value = "";
                $("inp-sub").value = "";
                pushPatch({ title_text: "", title_sub: "" }, "Title hidden");
            });

            // Events & ADS-B Replay List
            function fmtTime(iso) {
                try {
                    const d = new Date(iso);
                    return d.toLocaleTimeString("vi-VN", { hour12: false }) + " " + d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit" });
                } catch (e) { return iso || ""; }
            }

            function selectEventForObs(idx, autoZoom) {
                if (idx < 0 || idx >= eventsList.length) return;
                selectedEventIdx = idx;
                const ev = eventsList[idx];
                const isMeteor = ev.type === "meteor";
                const fl = ev.flight || ev.nearest_flight;
                const icon = isMeteor ? "☄️ Meteors" : ev.type === "satellite" ? "🛰️ Satellite" : `✈️ ${fl ? (fl.callsign || fl.icao) : "Aircraft"}`;
                const label = `${icon} • ${fmtTime(ev.timestamp)}${fl && fl.altitude_m ? ` • ${fl.altitude_m}m` : ""}`;
                const skyUrl = ev.sky_url || ev.thumbnail_url || "";
                const cropUrl = (ev.sky_url && ev.thumbnail_url && ev.thumbnail_url !== ev.sky_url) ? ev.thumbnail_url : "";

                const patch = {
                    view_mode: "event",
                    replay_url: skyUrl,
                    replay_crop_url: cropUrl,
                    replay_label: label,
                    replay_bbox: Array.isArray(ev.line) && ev.line.length >= 4 ? ev.line.slice(0, 4) : [],
                };

                if (autoZoom && Array.isArray(ev.line) && ev.line.length >= 4) {
                    const cx = (ev.line[0] + ev.line[2]) * 0.5;
                    const cy = (ev.line[1] + ev.line[3]) * 0.5;
                    patch.zoom = 2.6;
                    patch.pan_x = Math.max(-75, Math.min(75, Number(((0.5 - cx) * 140).toFixed(1))));
                    patch.pan_y = Math.max(-75, Math.min(75, Number(((0.5 - cy) * 140).toFixed(1))));
                } else if (!autoZoom) {
                    patch.zoom = 1.0;
                    patch.pan_x = 0.0;
                    patch.pan_y = 0.0;
                }
                renderEventRows();
                pushPatch(patch, "Playing on OBS: " + icon);
            }

            function renderEventRows() {
                const container = $("ev-list");
                if (currentTab === "adsb") {
                    if (!adsbList.length) {
                        container.innerHTML = `<div class="ev-empty">No ADS-B aircraft in coverage area.</div>`;
                        return;
                    }
                    container.innerHTML = adsbList.map((a, i) => {
                        const call = a.callsign || a.icao || "UNKNOWN";
                        const alt = a.altitude_m ? `${a.altitude_m}m` : "--m";
                        const spd = a.speed_kmh ? `${a.speed_kmh}km/h` : "";
                        const dist = a.distance_km ? `${a.distance_km}km` : "";
                        const pos = a.alt_deg !== undefined ? `Alt ${Math.round(a.alt_deg)}° • Az ${Math.round(a.az_deg || 0)}°` : "";
                        return `<div class="ev-item" data-adsb-idx="${i}">
                            <div class="ev-info">
                                <div class="ev-top"><span>✈️ ${call} ${a.in_view ? "🟢(Trong khung)" : ""}</span><span>${alt} • ${dist}</span></div>
                                <div class="ev-sub">${pos} ${spd ? "• " + spd : ""}</div>
                            </div>
                            <button type="button" class="btn-sm adsb-pin" data-adsb-idx="${i}" title="Enable Radar & pin aircraft title">Pin to OBS</button>
                        </div>`;
                    }).join("");

                    container.querySelectorAll(".adsb-pin").forEach((b) => {
                        b.addEventListener("click", (e) => {
                            e.stopPropagation();
                            const ac = adsbList[Number(b.dataset.adsbIdx)];
                            if (!ac) return;
                            const call = ac.callsign || ac.icao;
                            const patch = {
                                view_mode: "live",
                                adsb_overlay: true,
                                title_text: `✈️ Flight ${call}`,
                                title_sub: `Altitude: ${ac.altitude_m || "--"}m • Speed: ${ac.speed_kmh || "--"}km/h • Distance: ${ac.distance_km || "--"}km`,
                            };
                            if (Array.isArray(ac.frame_xy) && ac.frame_xy.length === 2) {
                                patch.zoom = 2.2;
                                patch.pan_x = Math.max(-75, Math.min(75, Number(((0.5 - ac.frame_xy[0]) * 120).toFixed(1))));
                                patch.pan_y = Math.max(-75, Math.min(75, Number(((0.5 - ac.frame_xy[1]) * 120).toFixed(1))));
                            }
                            pushPatch(patch, `Pinned ${call}`);
                        });
                    });
                    return;
                }

                if (!eventsList.length) {
                    container.innerHTML = `<div class="ev-empty">No events in this category yet.</div>`;
                    return;
                }

                container.innerHTML = eventsList.map((ev, i) => {
                    const isMeteor = ev.type === "meteor";
                    const fl = ev.flight || ev.nearest_flight;
                    const badge = isMeteor ? "☄️ Meteors" : ev.type === "satellite" ? "🛰️ Satellite" : `✈️ ${fl ? (fl.callsign || fl.icao) : "Aircraft"}`;
                    const detail = fl
                        ? `Alt ${fl.altitude_m || "--"}m • Dist ${fl.distance_km || "--"}km`
                        : `Length ${Math.round(ev.length_px || 0)}px • ${ev.frames || 1} frames`;
                    const thumb = ev.thumbnail_url ? `<img class="ev-thumb" src="${ev.thumbnail_url}" loading="lazy" />` : "";
                    return `<div class="ev-item ${i === selectedEventIdx ? "active" : ""}" data-idx="${i}">
                        ${thumb}
                        <div class="ev-info">
                            <div class="ev-top"><span>${badge}</span><span style="color:#cbd5e1;font-weight:700;font-size:13px">${fmtTime(ev.timestamp)}</span></div>
                            <div class="ev-sub">${detail}</div>
                        </div>
                        <button type="button" class="btn-sm ev-zoom-btn" data-idx="${i}" title="Play & zoom to position">🔍</button>
                    </div>`;
                }).join("");

                container.querySelectorAll(".ev-item[data-idx]").forEach((row) => {
                    row.addEventListener("click", (e) => {
                        if (e.target.closest(".ev-zoom-btn")) return;
                        selectEventForObs(Number(row.dataset.idx), false);
                    });
                });
                container.querySelectorAll(".ev-zoom-btn").forEach((btn) => {
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        selectEventForObs(Number(btn.dataset.idx), true);
                    });
                });
            }

            async function loadEventsOrAdsb() {
                try {
                    if (currentTab === "adsb") {
                        const r = await fetch("/api/adsb/aircraft?limit=30");
                        if (r.ok) {
                            const d = await r.json();
                            adsbList = d.aircraft || [];
                            renderEventRows();
                        }
                        return;
                    }
                    const q = currentTab === "all" ? "" : `&type=${currentTab}`;
                    const r = await fetch(`/api/events?limit=50${q}`);
                    if (r.ok) {
                        const d = await r.json();
                        eventsList = d.events || [];
                        const c = d.counts || {};
                        const tabs = document.querySelectorAll(".ev-tab");
                        if (tabs[1] && c.meteor !== undefined) tabs[1].textContent = `☄️ Meteors (${c.meteor})`;
                        if (tabs[2] && c.plane !== undefined) tabs[2].textContent = `✈️ Aircraft (${c.plane})`;
                        renderEventRows();
                    }
                } catch (e) {
                    console.error("[OBS:Dock] Failed to load events:", e);
                }
            }

            document.querySelectorAll(".ev-tab").forEach((btn) => {
                btn.addEventListener("click", () => {
                    currentTab = btn.dataset.tab;
                    selectedEventIdx = -1;
                    document.querySelectorAll(".ev-tab").forEach((b) => b.classList.toggle("active", b === btn));
                    loadEventsOrAdsb();
                });
            });

            $("btn-ev-prev").addEventListener("click", () => {
                if (!eventsList.length) return;
                const next = selectedEventIdx <= 0 ? 0 : selectedEventIdx - 1;
                selectEventForObs(next, false);
            });
            $("btn-ev-next").addEventListener("click", () => {
                if (!eventsList.length) return;
                const next = selectedEventIdx < 0 ? 0 : Math.min(eventsList.length - 1, selectedEventIdx + 1);
                selectEventForObs(next, false);
            });
            $("btn-ev-reload").addEventListener("click", () => {
                loadEventsOrAdsb();
                notify("Events refreshed");
            });

            // Camera Quick Controls
            $("cam-auto").addEventListener("click", async () => {
                await fetch("/api/camera/mode", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode: "auto" }) });
                $("cam-auto").classList.add("active");
                $("cam-manual").classList.remove("active");
                notify("Auto AE mode");
            });
            $("cam-manual").addEventListener("click", async () => {
                await fetch("/api/camera/mode", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode: "manual" }) });
                $("cam-manual").classList.add("active");
                $("cam-auto").classList.remove("active");
                notify("Manual mode");
            });
            $("cam-boost").addEventListener("click", async () => {
                starBoostOn = !starBoostOn;
                await fetch("/api/camera/star-boost", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: starBoostOn }) });
                $("cam-boost").classList.toggle("active", starBoostOn);
                notify(starBoostOn ? "Star Boost on" : "Star Boost off");
            });
            $("btn-cam-set").addEventListener("click", async () => {
                const exp = parseFloat($("inp-exp").value) || 1.0;
                const gain = parseFloat($("inp-gain").value) || 0.0;
                await fetch("/api/camera/mode", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode: "manual" }) });
                await fetch("/api/camera/exposure", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ exposure_s: exp, gain_db: gain }) });
                $("cam-manual").classList.add("active");
                $("cam-auto").classList.remove("active");
                notify(`Set ${exp}s / ${gain}dB`);
            });

            // LST Clock
            function updateClock() {
                const now = new Date();
                const jd = now.getTime() / 86400000.0 + 2440587.5;
                const d = jd - 2451545.0;
                const t = d / 36525.0;
                const gmst = (280.46061837 + 360.98564736629 * d + 0.000387933 * t * t - (t * t * t) / 38710000.0) % 360.0;
                const lmstDeg = ((gmst + stationLon) % 360.0 + 360.0) % 360.0;
                const totalH = lmstDeg / 15.0;
                const h = Math.floor(totalH);
                const m = Math.floor((totalH - h) * 60.0);
                const s = Math.floor(((totalH - h) * 60.0 - m) * 60.0);
                lblLst.textContent = `LST ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // WebSocket for instant sync + live telemetry in Dock
            let ws = null;
            function connectWs() {
                const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
                try {
                    ws = new WebSocket(proto + "//" + window.location.host + "/ws/live?binary=1");
                    ws.binaryType = "arraybuffer";
                    ws.onopen = () => { statusDot.className = "dot online"; };
                    ws.onmessage = (ev) => {
                        if (ev.data instanceof ArrayBuffer && ev.data.byteLength >= 36) {
                            const dv = new DataView(ev.data);
                            if (dv.getUint8(0) === 0x41 && dv.getUint8(1) === 0x53) {
                                const exp = dv.getFloat32(16, true);
                                const gain = dv.getFloat32(20, true);
                                const stars = dv.getUint32(32, true);
                                telemSummary.textContent = `${exp >= 1 ? exp.toFixed(1) + "s" : (exp * 1000).toFixed(0) + "ms"} • ${gain.toFixed(1)}dB • ${stars}★`;
                            }
                        } else if (typeof ev.data === "string") {
                            try {
                                const msg = JSON.parse(ev.data);
                                if (msg.type === "obs_overlay" && msg.settings) syncUI(msg.settings, true);
                            } catch (e) {
                                console.error("[OBS:Dock] Invalid WS JSON:", e);
                            }
                        }
                    };
                    ws.onclose = () => {
                        statusDot.className = "dot offline";
                        setTimeout(connectWs, 3000);
                    };
                } catch (e) {
                    console.error("[OBS:Dock] WS connection error:", e);
                    statusDot.className = "dot offline";
                }
            }

            // Initial data load
            fetch("/api/station/config").then((r) => r.json()).then((c) => {
                if (c && c.longitude_deg) stationLon = c.longitude_deg;
            }).catch((e) => console.error("[OBS:Dock] Config load error:", e));

            fetch("/api/obs/overlay").then((r) => r.json()).then((s) => syncUI(s)).catch((e) => console.error("[OBS:Dock] Overlay load error:", e));

            fetch("/api/camera/star-boost").then((r) => r.json()).then((d) => {
                starBoostOn = !!(d && d.enabled);
                $("cam-boost").classList.toggle("active", starBoostOn);
            }).catch((e) => console.error("[OBS:Dock] Star boost load error:", e));

            async function pollTelemetry() {
                try {
                    const r = await fetch("/api/telemetry");
                    if (r.ok) {
                        const d = await r.json();
                        if (d.mode) {
                            $("cam-auto").classList.toggle("active", d.mode === "auto");
                            $("cam-manual").classList.toggle("active", d.mode !== "auto");
                        }
                        const exp = d.exposure_time_s ?? d.exposure_s ?? 0;
                        const gain = d.gain_db ?? 0;
                        if (document.activeElement !== $("inp-exp") && exp > 0) {
                            $("inp-exp").value = exp < 0.01 ? Number(exp.toFixed(5)) : Number(exp.toFixed(3));
                        }
                        if (document.activeElement !== $("inp-gain")) $("inp-gain").value = Number(gain.toFixed(1));
                        $("cam-sky-info").textContent = `${d.sky_state || d.sky_status || "clear"} • Clouds ${Math.round(d.cloud_cover_pct || 0)}%`;
                    }
                } catch (e) {
                    console.error("[OBS:Dock] Telemetry poll error:", e);
                }
            }
            pollTelemetry();
            setInterval(pollTelemetry, 8000);

            loadEventsOrAdsb();
            setInterval(() => { if (currentTab === "adsb") loadEventsOrAdsb(); }, 5000);
            connectWs();
        })();
    </script>
</body>
</html>

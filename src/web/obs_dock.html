<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>OBS Dock — Zenivo</title>
    <meta name="theme-color" content="#070a13">
    <link rel="icon" href="/static/brand/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="description" content="Zenivo control dock for OBS Studio: stream overlays and live view settings.">
    <link rel="stylesheet" href="/static/css/ds-tokens.css?v=20261202b">
    <link rel="stylesheet" href="/static/css/ds-base.css?v=20261202b">
    <link rel="stylesheet" href="/static/css/ds-components.css?v=20261202b">
    <script>try{if(JSON.parse(localStorage.getItem("allsky.ui.prefs.v1")||"{}").nightVision)document.documentElement.setAttribute("data-theme","red")}catch(e){}</script>
    <script src="/static/js/ds.js?v=20261202b" defer></script>
    <style>
        .ds-chip.active { background: var(--c-accent-bg); border-color: var(--c-accent); color: var(--c-accent); }
        .ev-zoom-btn { width: 36px; min-width: 36px; min-height: 36px; flex: none; }
        body { user-select: none; -webkit-user-select: none; overflow-x: hidden; padding: var(--s-3); }
        .dock { width: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-3); }
        .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
        .head { display: flex; align-items: center; gap: var(--s-2); min-height: var(--tap); }
        .head .grow { flex: 1; min-width: 0; display: flex; align-items: center; gap: var(--s-2); }
        .head h1 { font-size: var(--fs-16); font-weight: 700; white-space: nowrap; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c-warn); flex: none; }
        .dot.online { background: var(--c-ok); }
        .dot.offline { background: var(--c-danger); }
        .pill.off { background: var(--c-surface-3); color: var(--c-text-2); }

        .preview { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 240px; border-radius: var(--r-lg);
            overflow: hidden; border: 1px solid var(--c-border); background: var(--c-bg); }
        .preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .preview .chips { position: absolute; top: var(--s-2); left: var(--s-2); display: flex; gap: var(--s-2); align-items: center; }
        .telem-mini { font-family: var(--font-num); font-size: var(--fs-12); color: var(--c-text); background: var(--c-scrim);
            border-radius: var(--r-pill); padding: var(--s-1) var(--s-3); white-space: nowrap; }
        #btn-go-live { min-height: 32px; min-width: 0; padding: 0 var(--s-3); gap: var(--s-1); font-size: var(--fs-12); }
        #btn-go-live.active { background: var(--c-danger); border-color: var(--c-danger); color: var(--c-on-accent); }

        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
        .stat { display: flex; align-items: center; gap: var(--s-2); min-width: 0; }
        .stat .ds-icon { color: var(--c-text-3); }
        .stat .v { font-family: var(--font-num); font-size: var(--fs-14); font-weight: 600; white-space: nowrap; }

        .sec { display: flex; flex-direction: column; gap: var(--s-3); }
        .sec-head { display: flex; align-items: center; gap: var(--s-2); color: var(--c-text-2); min-height: 28px; }
        .sec-head .grow { flex: 1; }
        .sec-head .num { font-size: var(--fs-12); color: var(--c-text-3); }
        .row { display: flex; align-items: center; gap: var(--s-2); }
        .row.wrap { flex-wrap: wrap; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--s-2); }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-2); }
        .seg { display: flex; gap: var(--s-1); padding: var(--s-1); background: var(--c-surface-2); border: 1px solid var(--c-border); border-radius: var(--r-lg); }
        .seg > button { flex: 1 1 0; min-width: 0; border-color: transparent; background: transparent; padding: 0 var(--s-2); }
        .lbl { font-size: var(--fs-12); font-weight: 600; color: var(--c-text-2); min-width: 44px; flex: none; }
        .val { font-family: var(--font-num); font-size: var(--fs-12); font-weight: 600; color: var(--c-accent); min-width: 44px; text-align: right; flex: none; }
        .ds-btn { font-size: var(--fs-12); font-weight: 600; padding: 0 var(--s-3); }
        .ds-btn .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ds-btn.active { background: var(--c-accent-bg); border-color: var(--c-accent); color: var(--c-accent); }
        /* icon tile: icon on top, short label below, on/off by colour */
        button.tile { flex-direction: column; gap: var(--s-1); min-height: 64px; padding: var(--s-2); }
        button.tile .t { font-size: var(--fs-12); max-width: 100%; }
        button.tile:not(.active) { color: var(--c-text-2); }
        .sw-row { display: flex; align-items: center; gap: var(--s-3); min-height: var(--tap); border-top: 1px solid var(--c-divider); }
        .sw-row .ds-icon { color: var(--c-text-2); }
        .sw-row span.t { flex: 1; font-size: var(--fs-14); }
        button.sw { position: relative; width: 48px; height: 28px; min-height: 28px; min-width: 48px; padding: 0; border-radius: var(--r-pill);
            background: var(--c-surface-3); border: 1px solid var(--c-border); cursor: pointer; flex: none; }
        button.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
            background: var(--c-text-2); transition: transform var(--dur) var(--ease); }
        button.sw.active { background: var(--c-accent-bg); border-color: var(--c-accent); }
        button.sw.active::after { transform: translateX(20px); background: var(--c-accent); }

        input[type="range"] { flex: 1; min-width: 60px; height: var(--tap); accent-color: var(--c-accent); cursor: pointer; }
        input[type="text"], input[type="number"], select {
            background: var(--c-surface-2); border: 1px solid var(--c-border); color: var(--c-text); border-radius: var(--r-md);
            min-height: var(--tap); padding: 0 var(--s-3); font-size: var(--fs-14); font-family: inherit;
            user-select: text; -webkit-user-select: text; min-width: 0; }
        input[type="number"] { font-family: var(--font-num); }
        input:focus-visible, select:focus-visible { outline: 2px solid var(--c-focus); outline-offset: 1px; }

        details.adv > summary { cursor: pointer; list-style: none; min-height: var(--tap); display: flex; align-items: center; gap: var(--s-3); color: var(--c-text-2); }
        details.adv > summary::-webkit-details-marker { display: none; }
        details.adv > summary .grow { flex: 1; }
        details.adv > summary .chev { transition: transform var(--dur) var(--ease); }
        details.adv[open] > summary .chev { transform: rotate(180deg); }
        details.adv .adv-body { display: flex; flex-direction: column; gap: var(--s-4); padding-top: var(--s-2); }
        .sub-head { display: flex; align-items: center; gap: var(--s-2); color: var(--c-text-2); border-top: 1px solid var(--c-divider); padding-top: var(--s-3); }
        .sub-head .grow { flex: 1; }

        .ev-list { max-height: 220px; overflow-y: auto; border: 1px solid var(--c-border); border-radius: var(--r-md); background: var(--c-bg); }
        .ev-item { display: flex; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-3); min-height: var(--tap);
            border-bottom: 1px solid var(--c-divider); cursor: pointer; font-size: var(--fs-12); }
        .ev-item:last-child { border-bottom: none; }
        .ev-item.active { background: var(--c-accent-bg); box-shadow: inset 3px 0 0 var(--c-accent); }
        .ev-thumb { width: 44px; height: 33px; object-fit: cover; border-radius: var(--r-sm); background: var(--c-bg); flex: none; }
        .ev-info { flex: 1; min-width: 0; }
        .ev-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ev-top .ds-icon { vertical-align: -3px; margin-right: var(--s-1); }
        .ev-time { font-family: var(--font-num); font-weight: 700; font-size: var(--fs-12); color: var(--c-text-2); }
        .ev-sub { font-family: var(--font-num); font-size: var(--fs-12); color: var(--c-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ev-empty { padding: var(--s-4); text-align: center; color: var(--c-text-3); font-size: var(--fs-12); }

        /* Stop stream needs a ~1 s press-and-hold */
        .danger-zone { display: flex; flex-direction: column; gap: var(--s-2); margin-top: var(--s-2); }
        button.btn-danger { position: relative; overflow: hidden; min-height: 52px; }
        button.btn-danger::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
            background: var(--c-danger-bg); transition: width 0s; pointer-events: none; }
        button.btn-danger.holding::before { width: 100%; transition: width 1s linear; }
        button.btn-danger > * { position: relative; }
        button.btn-danger.stopped { border-color: var(--c-ok); color: var(--c-ok); background: var(--c-ok-bg); }
        .hint { display: flex; align-items: center; justify-content: center; gap: var(--s-1); font-size: var(--fs-12); color: var(--c-text-3); }
    </style>
</head>
<body>
    <div class="dock">
        <!-- Header -->
        <div class="head">
            <div class="grow">
                <span id="status-dot" class="dot" title="Connection status" role="img" aria-label="Connection status"></span>
                <h1>OBS</h1>
                <span id="stream-pill" class="ds-chip ds-chip--ok pill" title="Stream state"><svg class="ds-icon ds-icon--sm" aria-hidden="true"><use href="/static/icons.svg#i-radio"></use></svg><span class="t">Streaming</span></span>
            </div>
            <button id="btn-snap" class="ds-btn ds-btn--icon" aria-label="Reload OBS" title="Refresh OBS Browser Source"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-refresh-cw"></use></svg></button>
            <button id="btn-open-obs" class="ds-btn ds-btn--icon" aria-label="Open /obs page" title="Open /obs page"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-arrow-up-right"></use></svg></button>
        </div>

        <!-- Preview -->
        <div class="preview">
            <img id="pv-img" alt="Live preview" src="/api/live/snapshot.jpg">
            <div class="chips">
                <button id="btn-go-live" class="ds-btn active" aria-label="Back to live camera feed" title="Back to live camera feed"><svg class="ds-icon ds-icon--sm" aria-hidden="true"><use href="/static/icons.svg#i-radio"></use></svg><span class="t">LIVE</span></button>
                <span id="telem-summary" class="telem-mini">-- ms · -- dB</span>
            </div>
        </div>

        <!-- Stream stats -->
        <div class="ds-card stats">
            <div class="stat" title="Uptime"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-clock"></use></svg><span class="v" id="st-uptime">00:00:00</span></div>
            <div class="stat" title="Bitrate"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-activity"></use></svg><span class="v" id="st-bitrate">&mdash;</span></div>
            <div class="stat" title="Dropped frames"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-triangle-alert"></use></svg><span class="v" id="st-dropped">&mdash;</span></div>
        </div>

        <!-- View mode -->
        <div class="ds-card sec">
            <div class="sec-head"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-eye"></use></svg><span class="grow ds-card__title">View</span></div>
            <div class="seg" role="group" aria-label="View">
                <button type="button" class="ds-btn mode-btn active" data-mode="live" aria-label="Live" title="Live"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-radio"></use></svg></button>
                <button type="button" class="ds-btn mode-btn" data-mode="timelapse" aria-label="Timelapse" title="Timelapse"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-film"></use></svg></button>
                <button type="button" class="ds-btn mode-btn" data-mode="startrails" aria-label="Startrails" title="Startrails"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-sparkles"></use></svg></button>
                <button type="button" class="ds-btn mode-btn" data-mode="keogram" aria-label="Keogram" title="Keogram"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-image"></use></svg></button>
                <button type="button" class="ds-btn mode-btn" data-mode="sky" aria-label="Sky View" title="Sky View"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-telescope"></use></svg></button>
            </div>
        </div>

        <!-- Overlays -->
        <div class="ds-card sec">
            <div class="sec-head"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-layers"></use></svg><span class="grow ds-card__title">Overlays</span><span id="lbl-lst" class="num">LST --:--:--</span></div>
            <div class="seg" role="group" aria-label="Preset">
                <button type="button" id="pre-full" class="ds-btn" title="All overlays on"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-layers"></use></svg><span class="t">Full</span></button>
                <button type="button" id="pre-clean" class="ds-btn" title="Stargazing: constellations + sun/moon only"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-sparkles"></use></svg><span class="t">Clean</span></button>
                <button type="button" id="pre-raw" class="ds-btn" title="Raw video, no overlays"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-camera"></use></svg><span class="t">Raw</span></button>
            </div>
            <div class="grid">
                <button type="button" id="tg-sky" class="ds-btn tile tg" title="Constellations & bright stars"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-star"></use></svg><span class="t">Constellations</span></button>
                <button type="button" id="tg-labels" class="ds-btn tile tg" title="Constellation & star names"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-type"></use></svg><span class="t">Star names</span></button>
                <button type="button" id="tg-grid" class="ds-btn tile tg" title="Coordinate grid & compass"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-compass"></use></svg><span class="t">Grid</span></button>
                <button type="button" id="tg-adsb" class="ds-btn tile tg" title="Live ADS-B aircraft radar"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-plane"></use></svg><span class="t">ADS-B</span></button>
                <button type="button" id="tg-sunmoon" class="ds-btn tile tg" title="Sun, Moon and naked-eye planets"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-sun"></use></svg><span class="t">Solar system</span></button>
                <button type="button" id="tg-dso" class="ds-btn tile tg" title="Messier deep-sky objects"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-moon-star"></use></svg><span class="t">Deep sky</span></button>
                <button type="button" id="tg-night" class="ds-btn tile tg" title="Red tint to protect night vision"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-eye"></use></svg><span class="t">Red light</span></button>
            </div>
            <div>
                <div class="sw-row"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-clock"></use></svg><span class="t">Clock</span><button type="button" id="tg-badge" class="sw" aria-label="Clock" title="Info badge with LST clock"></button></div>
                <div class="sw-row"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-zap"></use></svg><span class="t">Meteor counter</span><button type="button" id="tg-events" class="sw" aria-label="Meteor counter" title="Recent meteor &amp; aircraft trails"></button></div>
                <div class="sw-row"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-type"></use></svg><span class="t">Caption</span><button type="button" id="tg-caption" class="sw" aria-label="Station caption" title="Show station caption title"></button></div>
            </div>
        </div>

        <!-- Zoom -->
        <div class="ds-card sec">
            <div class="sec-head"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-search"></use></svg><span class="grow ds-card__title">Zoom</span>
                <button type="button" id="btn-reset-view" class="ds-btn ds-btn--icon" aria-label="Reset view" title="Reset view"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-rotate-ccw"></use></svg></button></div>
            <div class="row">
                <button type="button" id="btn-zoom-out" class="ds-btn ds-btn--icon" aria-label="Zoom out" title="Zoom out"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-minus"></use></svg></button>
                <input type="range" id="rng-zoom" min="1.0" max="6.0" step="0.1" value="1.0" aria-label="Zoom">
                <button type="button" id="btn-zoom-in" class="ds-btn ds-btn--icon" aria-label="Zoom in" title="Zoom in"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-plus"></use></svg></button>
                <span id="val-zoom" class="val">1.0x</span>
            </div>
            <div class="grid-3">
                <button type="button" class="ds-btn z-quick" data-z="1">1x</button>
                <button type="button" class="ds-btn z-quick" data-z="2">2x</button>
                <button type="button" class="ds-btn z-quick" data-z="4">4x</button>
            </div>
        </div>

        <!-- Advanced -->
        <details class="adv ds-card">
            <summary><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-sliders-horizontal"></use></svg><span class="grow ds-card__title">More</span><svg class="ds-icon chev" aria-hidden="true"><use href="/static/icons.svg#i-chevron-down"></use></svg></summary>
            <div class="adv-body">
                <div class="grid">
                    <button type="button" id="btn-fit" class="ds-btn" title="Toggle 16:9 Cover / 4:3 Original"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-maximize"></use></svg><span class="t">16:9</span></button>
                    <button type="button" id="btn-res" class="ds-btn" title="Picture size sent to /obs: same as /live, or the full output resolution"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-image"></use></svg><span class="t">As /live</span></button>
                    <button type="button" id="btn-bg" class="ds-btn" title="Toggle Black / Transparent background"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-moon"></use></svg><span class="t">Black</span></button>
                </div>
                <div class="row">
                    <span class="lbl">Sharp</span>
                    <input type="range" id="rng-opacity" min="0.1" max="1.0" step="0.05" value="1.0" aria-label="Sharpness">
                    <span id="val-opacity" class="val">100%</span>
                </div>

                <div class="sub-head"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-crosshair"></use></svg><span class="grow ds-card__title">Pan &amp; rotate</span></div>
                <div class="row wrap">
                    <button type="button" class="ds-btn ds-btn--icon pan-step" data-dx="-8" data-dy="0" aria-label="Left" title="Left"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-chevron-left"></use></svg></button>
                    <button type="button" class="ds-btn ds-btn--icon pan-step" data-dx="0" data-dy="-8" aria-label="Up" title="Up"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-chevron-up"></use></svg></button>
                    <button type="button" class="ds-btn ds-btn--icon pan-step" data-dx="0" data-dy="8" aria-label="Down" title="Down"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-chevron-down"></use></svg></button>
                    <button type="button" class="ds-btn ds-btn--icon pan-step" data-dx="8" data-dy="0" aria-label="Right" title="Right"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-chevron-right"></use></svg></button>
                    <button type="button" class="ds-btn ds-btn--icon" id="btn-pan-center" aria-label="Center" title="Center"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-crosshair"></use></svg></button>
                </div>
                <div class="row"><span class="lbl">X</span><input type="range" id="rng-panx" min="-80" max="80" step="1" value="0" aria-label="Pan horizontal" title="Pan horizontal (X)"></div>
                <div class="row"><span class="lbl">Y</span><input type="range" id="rng-pany" min="-80" max="80" step="1" value="0" aria-label="Pan vertical" title="Pan vertical (Y)"></div>
                <div class="row">
                    <span class="lbl"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-rotate-ccw"></use></svg></span>
                    <input type="range" id="rng-rotate" min="-180" max="180" step="1" value="0" aria-label="Rotate">
                    <span id="val-rotate" class="val">0&deg;</span>
                </div>
                <div class="grid">
                    <button type="button" class="ds-btn rot-quick" data-r="0">0&deg;</button>
                    <button type="button" class="ds-btn rot-quick" data-r="90">90&deg;</button>
                    <button type="button" class="ds-btn rot-quick" data-r="180">180&deg;</button>
                    <button type="button" id="btn-fliph" class="ds-btn" title="Flip horizontal" aria-label="Flip horizontal">H&#8646;</button>
                    <button type="button" id="btn-flipv" class="ds-btn" title="Flip vertical" aria-label="Flip vertical">V&#8645;</button>
                </div>
                <div class="row">
                    <span class="lbl"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-sun"></use></svg></span>
                    <input type="range" id="rng-bright" min="0.5" max="2.5" step="0.05" value="1.0" aria-label="Brightness">
                    <span id="val-bright" class="val">1.0</span>
                </div>
                <div class="row">
                    <span class="lbl"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-sliders-horizontal"></use></svg></span>
                    <input type="range" id="rng-contrast" min="0.5" max="2.5" step="0.05" value="1.0" aria-label="Contrast">
                    <span id="val-contrast" class="val">1.0</span>
                </div>

                <div class="sub-head"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-type"></use></svg><span class="grow ds-card__title">Title</span>
                    <select id="sel-title-pos" aria-label="Title position">
                        <option value="bottom-left">Bottom left</option>
                        <option value="bottom-center">Bottom center</option>
                        <option value="top-left">Top left</option>
                        <option value="top-center">Top center</option>
                    </select>
                </div>
                <div class="row">
                    <input type="text" id="inp-title" placeholder="Title" aria-label="Main title" style="flex:1.2">
                    <input type="text" id="inp-sub" placeholder="Subtitle" aria-label="Subtitle" style="flex:1">
                </div>
                <div class="row">
                    <button type="button" id="btn-title-apply" class="ds-btn ds-btn--primary" style="flex:1" aria-label="Show title" title="Show"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-check"></use></svg></button>
                    <button type="button" id="btn-title-clear" class="ds-btn" style="flex:1" aria-label="Clear title" title="Clear"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-x"></use></svg></button>
                </div>

                <div class="sub-head"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-film"></use></svg><span class="grow ds-card__title">Replay</span>
                    <button type="button" id="btn-ev-prev" class="ds-btn ds-btn--icon" aria-label="Previous event" title="Previous event"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-chevron-left"></use></svg></button>
                    <button type="button" id="btn-ev-next" class="ds-btn ds-btn--icon" aria-label="Next event" title="Next event"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-chevron-right"></use></svg></button>
                    <button type="button" id="btn-ev-reload" class="ds-btn ds-btn--icon" aria-label="Reload list" title="Reload list"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-refresh-cw"></use></svg></button>
                </div>
                <div class="ds-chips" id="ev-tabs">
                    <button type="button" class="ds-chip ev-tab active" data-tab="all">All</button>
                    <button type="button" class="ds-chip ev-tab" data-tab="meteor">Meteors</button>
                    <button type="button" class="ds-chip ev-tab" data-tab="plane">Aircraft</button>
                    <button type="button" class="ds-chip ev-tab" data-tab="adsb">Radar</button>
                </div>
                <div id="ev-list" class="ev-list"><div class="ev-empty">Loading…</div></div>

                <div class="sub-head"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-camera"></use></svg><span class="grow ds-card__title">Camera</span><span id="cam-sky-info" class="num">--</span></div>
                <div class="seg" role="group" aria-label="Exposure mode">
                    <button type="button" id="cam-auto" class="ds-btn" title="Auto exposure"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-sparkles"></use></svg><span class="t">Auto</span></button>
                    <button type="button" id="cam-manual" class="ds-btn" title="Manual exposure"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-sliders-horizontal"></use></svg><span class="t">Manual</span></button>
                    <button type="button" id="cam-boost" class="ds-btn" title="Star boost"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-star"></use></svg><span class="t">Boost</span></button>
                </div>
                <div class="row">
                    <input type="number" id="inp-exp" step="any" min="0.0001" max="90" value="0.01" style="width:96px" aria-label="Exposure seconds" title="Exposure (s)">
                    <input type="number" id="inp-gain" step="1" min="0" max="72" value="0" style="width:72px" aria-label="Gain" title="Gain">
                    <button type="button" id="btn-cam-set" class="ds-btn ds-btn--primary" style="flex:1" aria-label="Apply" title="Apply"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-check"></use></svg></button>
                </div>
            </div>
        </details>

        <!-- Snapshot -->
        <button type="button" id="btn-take-snapshot" class="ds-btn" title="Open a full-resolution snapshot" aria-label="Take snapshot"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-camera"></use></svg><span class="t">Snapshot</span></button>

        <!-- Danger zone -->
        <div class="danger-zone">
            <button type="button" id="btn-stop-stream" class="ds-btn ds-btn--danger btn-danger" title="Pause the dock preview and uptime" aria-label="Hold to stop stream"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-power"></use></svg><span class="t">Hold to stop</span></button>
            <span class="hint"><svg class="ds-icon ds-icon--sm" aria-hidden="true"><use href="/static/icons.svg#i-info"></use></svg>1 s</span>
        </div>
    </div>

    <div class="ds-toasts" aria-live="polite"></div>

    <script>
        (function () {
            const $ = (id) => document.getElementById(id);
            const statusDot = $("status-dot");
            const telemSummary = $("telem-summary");
            const lblLst = $("lbl-lst");

            let state = {
                sky_overlay: false,
                sky_labels: false,
                dso_overlay: false,
                grid_overlay: false,
                sun_moon: true,
                badge: true,
                adsb_overlay: false,
                events_overlay: false,
                fit: "cover",
                bg: "black",
                night_vision: false,
                opacity: 1.0,
                zoom: 1.0,
                pan_x: 0.0,
                pan_y: 0.0,
                rotate: 0.0,
                flip_h: false,
                flip_v: false,
                brightness: 1.0,
                contrast: 1.0,
                title_text: "",
                title_sub: "",
                title_pos: "bottom-left",
                view_mode: "live",
                replay_url: "",
                replay_crop_url: "",
                replay_label: "",
            };

            let stationLon = 0;
            let currentTab = "all";
            let eventsList = [];
            let adsbList = [];
            let selectedEventIdx = -1;
            let starBoostOn = false;

            let lastSliderDragTs = 0;
            let pendingPatch = {};
            let patchTimer = null;
            let inFlight = false;

            function notify(msg) {
                if (window.DS && DS.toast) DS.toast(msg);
            }

            function syncUI(s, fromServer = false) {
                if (s) {
                    if (fromServer && Date.now() - lastSliderDragTs < 700) {
                        const { zoom, pan_x, pan_y, rotate, brightness, contrast, opacity, ...rest } = s;
                        Object.assign(state, rest);
                    } else {
                        Object.assign(state, s);
                    }
                }

                $("btn-go-live").classList.toggle("active", state.view_mode === "live");
                document.querySelectorAll(".mode-btn").forEach((b) => {
                    const isSky = state.view_mode === "sky" || (state.view_mode === "event" && String(state.replay_url || "").startsWith("/sky"));
                    b.classList.toggle("active", b.dataset.mode === "sky" ? isSky : (!isSky && b.dataset.mode === state.view_mode));
                });

                $("tg-sky").classList.toggle("active", !!state.sky_overlay);
                $("tg-labels").classList.toggle("active", !!state.sky_labels);
                $("tg-grid").classList.toggle("active", !!state.grid_overlay);
                $("tg-dso").classList.toggle("active", !!state.dso_overlay);
                $("tg-sunmoon").classList.toggle("active", state.sun_moon !== false);
                $("tg-adsb").classList.toggle("active", !!state.adsb_overlay);
                $("tg-events").classList.toggle("active", !!state.events_overlay);
                $("tg-badge").classList.toggle("active", state.badge !== false);
                $("tg-night").classList.toggle("active", !!state.night_vision);
                $("tg-caption").classList.toggle("active", !!(state.title_text || state.title_sub));

                $("btn-fit").querySelector(".t").textContent = state.fit === "contain" ? "4:3" : "16:9";
                $("btn-fit").classList.toggle("active", state.fit === "contain");
                $("btn-res").querySelector(".t").textContent = state.res === "full" ? "Full" : "As /live";
                $("btn-res").classList.toggle("active", state.res === "full");
                $("btn-bg").querySelector(".t").textContent = state.bg === "transparent" ? "Alpha" : "Black";
                $("btn-bg").classList.toggle("active", state.bg === "transparent");

                if (!fromServer || Date.now() - lastSliderDragTs >= 700) {
                    $("rng-opacity").value = state.opacity ?? 1.0;
                    $("val-opacity").textContent = Math.round((state.opacity ?? 1.0) * 100) + "%";

                    $("rng-zoom").value = state.zoom ?? 1.0;
                    $("val-zoom").textContent = Number(state.zoom ?? 1.0).toFixed(1) + "x";
                    $("rng-panx").value = state.pan_x ?? 0;
                    $("rng-pany").value = state.pan_y ?? 0;
                    $("rng-rotate").value = state.rotate ?? 0;
                    $("val-rotate").textContent = Math.round(state.rotate ?? 0) + "°";

                    $("rng-bright").value = state.brightness ?? 1.0;
                    $("val-bright").textContent = Number(state.brightness ?? 1.0).toFixed(2);
                    $("rng-contrast").value = state.contrast ?? 1.0;
                    $("val-contrast").textContent = Number(state.contrast ?? 1.0).toFixed(2);
                }

                $("btn-fliph").classList.toggle("active", !!state.flip_h);
                $("btn-flipv").classList.toggle("active", !!state.flip_v);

                if (document.activeElement !== $("inp-title")) $("inp-title").value = state.title_text || "";
                if (document.activeElement !== $("inp-sub")) $("inp-sub").value = state.title_sub || "";
                $("sel-title-pos").value = state.title_pos || "bottom-left";
            }

            async function flushPatch(msg) {
                if (inFlight || Object.keys(pendingPatch).length === 0) return;
                inFlight = true;
                const body = pendingPatch;
                pendingPatch = {};
                try {
                    const r = await fetch("/api/obs/overlay", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(body),
                    });
                    if (r.ok) {
                        const d = await r.json();
                        if (d.settings) syncUI(d.settings, true);
                        if (msg) notify(msg);
                    }
                } catch (e) {
                    console.error("[OBS:Dock] Patch failed:", e);
                } finally {
                    inFlight = false;
                    if (Object.keys(pendingPatch).length > 0) {
                        flushPatch();
                    }
                }
            }

            function pushPatch(patch, msg, isSlider = false) {
                if (isSlider) lastSliderDragTs = Date.now();
                Object.assign(state, patch);
                Object.assign(pendingPatch, patch);
                syncUI();
                if (isSlider) {
                    if (!patchTimer) {
                        patchTimer = setTimeout(() => {
                            patchTimer = null;
                            flushPatch(msg);
                        }, 40);
                    }
                } else {
                    if (patchTimer) {
                        clearTimeout(patchTimer);
                        patchTimer = null;
                    }
                    flushPatch(msg);
                }
            }

            // Topbar buttons
            $("btn-go-live").addEventListener("click", () => {
                selectedEventIdx = -1;
                renderEventRows();
                pushPatch({ view_mode: "live", replay_url: "", replay_crop_url: "", replay_label: "" }, "Playing LIVE");
            });
            $("btn-snap").addEventListener("click", () => {
                fetch("/api/obs/reload", { method: "POST" }).catch((err) => console.error("[OBS:Dock] Reload failed:", err));
                notify("OBS refreshed");
            });
            $("btn-open-obs").addEventListener("click", () => window.open("/obs", "_blank"));


            // Zoom +/- buttons
            const stepZoom = (d) => pushPatch({ zoom: Math.max(1, Math.min(6, Math.round(((state.zoom || 1) + d) * 10) / 10)) }, null, true);
            $("btn-zoom-out").addEventListener("click", () => stepZoom(-0.5));
            $("btn-zoom-in").addEventListener("click", () => stepZoom(0.5));

            // Preview + stream stats (uptime is client-side; bitrate/dropped have no backend source)
            const pvImg = $("pv-img");
            let streaming = true;
            let streamStart = Date.now();
            let pvTimer = null;
            const pad2 = (n) => String(n).padStart(2, "0");
            function tickUptime() {
                if (!streaming) return;
                const t = Math.floor((Date.now() - streamStart) / 1000);
                $("st-uptime").textContent = `${pad2(Math.floor(t / 3600))}:${pad2(Math.floor(t / 60) % 60)}:${pad2(t % 60)}`;
            }
            function refreshPreview() {
                if (!streaming || document.hidden) return;
                pvImg.src = "/api/live/snapshot.jpg?t=" + Date.now();
            }
            setInterval(tickUptime, 1000);
            pvTimer = setInterval(refreshPreview, 1500);
            // Stop needs a 1 s press-and-hold; resume is a single click
            const stopBtn = $("btn-stop-stream");
            let holdTimer = null;
            function applyStreaming() {
                stopBtn.querySelector(".t").textContent = streaming ? "Hold to stop" : "Resume";
                stopBtn.classList.toggle("stopped", !streaming);
                $("stream-pill").querySelector(".t").textContent = streaming ? "Streaming" : "Stopped";
                $("stream-pill").classList.toggle("off", !streaming);
                if (streaming) { streamStart = Date.now(); refreshPreview(); }
                notify(streaming ? "Stream resumed" : "Stream stopped");
            }
            function cancelHold() {
                clearTimeout(holdTimer); holdTimer = null;
                stopBtn.classList.remove("holding");
            }
            stopBtn.addEventListener("pointerdown", (e) => {
                if (e.button !== undefined && e.button > 0) return;
                if (!streaming) { streaming = true; applyStreaming(); return; }
                stopBtn.classList.add("holding");
                holdTimer = setTimeout(() => {
                    holdTimer = null;
                    stopBtn.classList.remove("holding");
                    streaming = false;
                    applyStreaming();
                }, 1000);
            });
            ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => stopBtn.addEventListener(ev, cancelHold));
            $("btn-take-snapshot").addEventListener("click", () => {
                window.open("/api/live/snapshot.jpg?t=" + Date.now(), "_blank");
                notify("Snapshot opened");
            });

            // View Mode buttons
            document.querySelectorAll(".mode-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const m = btn.dataset.mode;
                    if (m === "live") {
                        selectedEventIdx = -1;
                        renderEventRows();
                        pushPatch({ view_mode: "live", replay_url: "", replay_crop_url: "", replay_label: "" }, "LIVE mode");
                    } else if (m === "timelapse") {
                        pushPatch({ view_mode: "timelapse", replay_url: "/uploads/allsky/timelapses/latest.mp4", replay_label: "🎬 TODAY TIMELAPSE" }, "Playing Timelapse");
                    } else if (m === "startrails") {
                        pushPatch({ view_mode: "startrails", replay_url: "/uploads/allsky/startrails/latest.jpg", replay_label: "🌀 STARTRAILS" }, "Showing Startrails");
                    } else if (m === "sky") {
                        pushPatch({ view_mode: "event", replay_url: "/sky?embed=1", replay_crop_url: "", replay_label: "SKY VIEW" }, "Showing Sky View");
                    } else if (m === "keogram") {
                        pushPatch({ view_mode: "keogram", replay_url: "/uploads/allsky/keograms/latest.jpg", replay_label: "📊 KEOGRAM" }, "Showing Keogram");
                    }
                });
            });

            // 8 Overlay Toggles
            const bindToggle = (id, key) => {
                $(id).addEventListener("click", () => pushPatch({ [key]: !state[key] }));
            };
            bindToggle("tg-sky", "sky_overlay");
            bindToggle("tg-labels", "sky_labels");
            bindToggle("tg-grid", "grid_overlay");
            bindToggle("tg-dso", "dso_overlay");
            bindToggle("tg-sunmoon", "sun_moon");
            bindToggle("tg-adsb", "adsb_overlay");
            bindToggle("tg-events", "events_overlay");
            bindToggle("tg-badge", "badge");
            bindToggle("tg-night", "night_vision");
            $("tg-caption").addEventListener("click", () => {
                const on = !!(state.title_text || state.title_sub);
                if (on) pushPatch({ title_text: "", title_sub: "" }, "Caption hidden");
                else pushPatch({ title_text: $("inp-title").value.trim() || "Zenivo Station", title_sub: $("inp-sub").value.trim(), title_pos: $("sel-title-pos").value }, "Caption shown");
            });

            // Presets & Fit/Bg
            $("pre-full").addEventListener("click", () => pushPatch({
                sky_overlay: true, sky_labels: true, grid_overlay: true, dso_overlay: true, sun_moon: true, adsb_overlay: true, events_overlay: true, badge: true
            }, "Preset: Full"));
            $("pre-clean").addEventListener("click", () => pushPatch({
                sky_overlay: true, sky_labels: false, grid_overlay: false, dso_overlay: false, sun_moon: true, adsb_overlay: false, events_overlay: false, badge: false
            }, "Preset: Stargazing"));
            $("pre-raw").addEventListener("click", () => pushPatch({
                sky_overlay: false, sky_labels: false, grid_overlay: false, dso_overlay: false, sun_moon: false, adsb_overlay: false, events_overlay: false, badge: false
            }, "Preset: Raw video"));

            $("btn-res").addEventListener("click", () => pushPatch({ res: state.res === "full" ? "stream" : "full" }));
            $("btn-fit").addEventListener("click", () => pushPatch({ fit: state.fit === "contain" ? "cover" : "contain" }));
            $("btn-bg").addEventListener("click", () => pushPatch({ bg: state.bg === "transparent" ? "black" : "transparent" }));

            const bindRange = (id, key) => {
                const el = $(id);
                const handler = (e) => pushPatch({ [key]: parseFloat(e.target.value) }, null, true);
                el.addEventListener("input", handler);
                el.addEventListener("change", handler);
            };
            bindRange("rng-opacity", "opacity");
            bindRange("rng-zoom", "zoom");
            document.querySelectorAll(".z-quick").forEach((b) => {
                b.addEventListener("click", () => {
                    const z = parseFloat(b.dataset.z);
                    pushPatch(z === 1 ? { zoom: 1.0, pan_x: 0, pan_y: 0 } : { zoom: z });
                });
            });

            document.querySelectorAll(".pan-step").forEach((b) => {
                b.addEventListener("click", () => {
                    const nx = Math.max(-80, Math.min(80, (state.pan_x || 0) + parseFloat(b.dataset.dx)));
                    const ny = Math.max(-80, Math.min(80, (state.pan_y || 0) + parseFloat(b.dataset.dy)));
                    pushPatch({ pan_x: nx, pan_y: ny });
                });
            });
            $("btn-pan-center").addEventListener("click", () => pushPatch({ pan_x: 0, pan_y: 0 }));
            bindRange("rng-panx", "pan_x");
            bindRange("rng-pany", "pan_y");

            bindRange("rng-rotate", "rotate");
            document.querySelectorAll(".rot-quick").forEach((b) => {
                b.addEventListener("click", () => pushPatch({ rotate: parseFloat(b.dataset.r) }));
            });
            $("btn-fliph").addEventListener("click", () => pushPatch({ flip_h: !state.flip_h }));
            $("btn-flipv").addEventListener("click", () => pushPatch({ flip_v: !state.flip_v }));

            bindRange("rng-bright", "brightness");
            bindRange("rng-contrast", "contrast");

            $("btn-reset-view").addEventListener("click", () => {
                pushPatch({
                    zoom: 1.0, pan_x: 0.0, pan_y: 0.0, rotate: 0.0,
                    flip_h: false, flip_v: false, brightness: 1.0, contrast: 1.0
                }, "Frame reset");
            });

            // Title Controls
            const applyTitle = () => {
                pushPatch({
                    title_text: $("inp-title").value.trim(),
                    title_sub: $("inp-sub").value.trim(),
                    title_pos: $("sel-title-pos").value,
                }, "Title updated");
            };
            $("btn-title-apply").addEventListener("click", applyTitle);
            $("inp-title").addEventListener("keydown", (e) => { if (e.key === "Enter") applyTitle(); });
            $("inp-sub").addEventListener("keydown", (e) => { if (e.key === "Enter") applyTitle(); });
            $("sel-title-pos").addEventListener("change", applyTitle);
            $("btn-title-clear").addEventListener("click", () => {
                $("inp-title").value = "";
                $("inp-sub").value = "";
                pushPatch({ title_text: "", title_sub: "" }, "Title hidden");
            });

            // Events & ADS-B Replay List
            function fmtTime(iso) {
                try {
                    const d = new Date(iso);
                    return d.toLocaleTimeString("en-GB", { hour12: false }) + " " + d.toLocaleDateString("en-GB", { day: "2-digit", month: "2-digit" });
                } catch (e) { return iso || ""; }
            }

            function escHtml(v) {
                return String(v === undefined || v === null ? "" : v)
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
            }
            // Only same-origin paths may be used as an image address (blocks javascript:, data: and cross-site URLs)
            function safeLocalUrl(u) {
                return typeof u === "string" && u.startsWith("/") && !u.startsWith("//") ? u : "";
            }

            function selectEventForObs(idx, autoZoom) {
                if (idx < 0 || idx >= eventsList.length) return;
                selectedEventIdx = idx;
                const ev = eventsList[idx];
                const isMeteor = ev.type === "meteor";
                const fl = ev.flight || ev.nearest_flight;
                const icon = isMeteor ? "Meteor" : ev.type === "satellite" ? `<svg class="ds-icon ds-icon--sm" aria-hidden="true"><use href="/static/icons.svg#i-satellite"></use></svg> Satellite` : `<svg class="ds-icon ds-icon--sm" aria-hidden="true"><use href="/static/icons.svg#i-plane"></use></svg> ${fl ? (fl.callsign || fl.icao) : "Aircraft"}`;
                const label = `${icon} • ${fmtTime(ev.timestamp)}${fl && fl.altitude_m ? ` • ${fl.altitude_m}m` : ""}`;
                const skyUrl = ev.sky_url || ev.thumbnail_url || "";
                const cropUrl = (ev.sky_url && ev.thumbnail_url && ev.thumbnail_url !== ev.sky_url) ? ev.thumbnail_url : "";

                const patch = {
                    view_mode: "event",
                    replay_url: skyUrl,
                    replay_crop_url: cropUrl,
                    replay_label: label,
                    replay_bbox: Array.isArray(ev.line) && ev.line.length >= 4 ? ev.line.slice(0, 4) : [],
                };

                if (autoZoom && Array.isArray(ev.line) && ev.line.length >= 4) {
                    const cx = (ev.line[0] + ev.line[2]) * 0.5;
                    const cy = (ev.line[1] + ev.line[3]) * 0.5;
                    patch.zoom = 2.6;
                    patch.pan_x = Math.max(-75, Math.min(75, Number(((0.5 - cx) * 140).toFixed(1))));
                    patch.pan_y = Math.max(-75, Math.min(75, Number(((0.5 - cy) * 140).toFixed(1))));
                } else if (!autoZoom) {
                    patch.zoom = 1.0;
                    patch.pan_x = 0.0;
                    patch.pan_y = 0.0;
                }
                renderEventRows();
                pushPatch(patch, "Playing on OBS: " + icon);
            }

            function renderEventRows() {
                const container = $("ev-list");
                if (currentTab === "adsb") {
                    if (!adsbList.length) {
                        container.innerHTML = `<div class="ev-empty">No ADS-B aircraft in coverage area.</div>`;
                        return;
                    }
                    container.innerHTML = adsbList.map((a, i) => {
                        const call = escHtml(a.callsign || a.icao || "UNKNOWN");
                        const alt = a.altitude_m ? `${a.altitude_m}m` : "--m";
                        const spd = a.speed_kmh ? `${a.speed_kmh}km/h` : "";
                        const dist = a.distance_km ? `${a.distance_km}km` : "";
                        const pos = a.alt_deg !== undefined ? `Alt ${Math.round(a.alt_deg)}° • Az ${Math.round(a.az_deg || 0)}°` : "";
                        return `<div class="ev-item" data-adsb-idx="${i}">
                            <div class="ev-info">
                                <div class="ev-top"><span><svg class="ds-icon ds-icon--sm" aria-hidden="true"><use href="/static/icons.svg#i-plane"></use></svg> ${call} ${a.in_view ? "(in view)" : ""}</span><span>${alt} • ${dist}</span></div>
                                <div class="ev-sub">${pos} ${spd ? "• " + spd : ""}</div>
                            </div>
                            <button type="button" class="btn-sm adsb-pin" data-adsb-idx="${i}" title="Enable Radar & pin aircraft title">Pin to OBS</button>
                        </div>`;
                    }).join("");

                    container.querySelectorAll(".adsb-pin").forEach((b) => {
                        b.addEventListener("click", (e) => {
                            e.stopPropagation();
                            const ac = adsbList[Number(b.dataset.adsbIdx)];
                            if (!ac) return;
                            const call = ac.callsign || ac.icao;
                            const patch = {
                                view_mode: "live",
                                adsb_overlay: true,
                                title_text: `✈️ Flight ${call}`,
                                title_sub: `Altitude: ${ac.altitude_m || "--"}m • Speed: ${ac.speed_kmh || "--"}km/h • Distance: ${ac.distance_km || "--"}km`,
                            };
                            if (Array.isArray(ac.frame_xy) && ac.frame_xy.length === 2) {
                                patch.zoom = 2.2;
                                patch.pan_x = Math.max(-75, Math.min(75, Number(((0.5 - ac.frame_xy[0]) * 120).toFixed(1))));
                                patch.pan_y = Math.max(-75, Math.min(75, Number(((0.5 - ac.frame_xy[1]) * 120).toFixed(1))));
                            }
                            pushPatch(patch, `Pinned ${call}`);
                        });
                    });
                    return;
                }

                if (!eventsList.length) {
                    container.innerHTML = `<div class="ev-empty">No events in this category yet.</div>`;
                    return;
                }

                container.innerHTML = eventsList.map((ev, i) => {
                    const isMeteor = ev.type === "meteor";
                    const fl = ev.flight || ev.nearest_flight;
                    const badge = isMeteor ? "Meteor" : ev.type === "satellite" ? `<svg class="ds-icon ds-icon--sm" aria-hidden="true"><use href="/static/icons.svg#i-satellite"></use></svg> Satellite` : `<svg class="ds-icon ds-icon--sm" aria-hidden="true"><use href="/static/icons.svg#i-plane"></use></svg> ${fl ? escHtml(fl.callsign || fl.icao) : "Aircraft"}`;
                    const detail = fl
                        ? `Alt ${fl.altitude_m || "--"}m • Dist ${fl.distance_km || "--"}km`
                        : `Length ${Math.round(ev.length_px || 0)}px • ${ev.frames || 1} frames`;
                    const thumbUrl = safeLocalUrl(ev.thumbnail_url);
                    const thumb = thumbUrl ? `<img class="ev-thumb" src="${escHtml(thumbUrl)}" loading="lazy" />` : "";
                    return `<div class="ev-item ${i === selectedEventIdx ? "active" : ""}" data-idx="${i}">
                        ${thumb}
                        <div class="ev-info">
                            <div class="ev-top"><span>${badge}</span><span class="ev-time">${fmtTime(ev.timestamp)}</span></div>
                            <div class="ev-sub">${detail}</div>
                        </div>
                        <button type="button" class="ds-btn ds-btn--icon ev-zoom-btn" data-idx="${i}" aria-label="Play & zoom to position" title="Play & zoom to position"><svg class="ds-icon" aria-hidden="true"><use href="/static/icons.svg#i-search"></use></svg></button>
                    </div>`;
                }).join("");

                container.querySelectorAll(".ev-item[data-idx]").forEach((row) => {
                    row.addEventListener("click", (e) => {
                        if (e.target.closest(".ev-zoom-btn")) return;
                        selectEventForObs(Number(row.dataset.idx), false);
                    });
                });
                container.querySelectorAll(".ev-zoom-btn").forEach((btn) => {
                    btn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        selectEventForObs(Number(btn.dataset.idx), true);
                    });
                });
            }

            async function loadEventsOrAdsb() {
                try {
                    if (currentTab === "adsb") {
                        const r = await fetch("/api/adsb/aircraft?limit=30");
                        if (r.ok) {
                            const d = await r.json();
                            adsbList = d.aircraft || [];
                            renderEventRows();
                        }
                        return;
                    }
                    const q = currentTab === "all" ? "" : `&type=${currentTab}`;
                    const r = await fetch(`/api/events?limit=50${q}`);
                    if (r.ok) {
                        const d = await r.json();
                        eventsList = d.events || [];
                        const c = d.counts || {};
                        const tabs = document.querySelectorAll(".ev-tab");
                        if (tabs[1] && c.meteor !== undefined) tabs[1].textContent = `Meteors (${c.meteor})`;
                        if (tabs[2] && c.plane !== undefined) tabs[2].textContent = `Aircraft (${c.plane})`;
                        renderEventRows();
                    }
                } catch (e) {
                    console.error("[OBS:Dock] Failed to load events:", e);
                }
            }

            document.querySelectorAll(".ev-tab").forEach((btn) => {
                btn.addEventListener("click", () => {
                    currentTab = btn.dataset.tab;
                    selectedEventIdx = -1;
                    document.querySelectorAll(".ev-tab").forEach((b) => b.classList.toggle("active", b === btn));
                    loadEventsOrAdsb();
                });
            });

            $("btn-ev-prev").addEventListener("click", () => {
                if (!eventsList.length) return;
                const next = selectedEventIdx <= 0 ? 0 : selectedEventIdx - 1;
                selectEventForObs(next, false);
            });
            $("btn-ev-next").addEventListener("click", () => {
                if (!eventsList.length) return;
                const next = selectedEventIdx < 0 ? 0 : Math.min(eventsList.length - 1, selectedEventIdx + 1);
                selectEventForObs(next, false);
            });
            $("btn-ev-reload").addEventListener("click", () => {
                loadEventsOrAdsb();
                notify("Events refreshed");
            });

            // Camera Quick Controls
            $("cam-auto").addEventListener("click", async () => {
                await fetch("/api/camera/mode", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode: "auto" }) });
                $("cam-auto").classList.add("active");
                $("cam-manual").classList.remove("active");
                notify("Auto AE mode");
            });
            $("cam-manual").addEventListener("click", async () => {
                await fetch("/api/camera/mode", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode: "manual" }) });
                $("cam-manual").classList.add("active");
                $("cam-auto").classList.remove("active");
                notify("Manual mode");
            });
            $("cam-boost").addEventListener("click", async () => {
                starBoostOn = !starBoostOn;
                await fetch("/api/camera/star-boost", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: starBoostOn }) });
                $("cam-boost").classList.toggle("active", starBoostOn);
                notify(starBoostOn ? "Star Boost on" : "Star Boost off");
            });
            $("btn-cam-set").addEventListener("click", async () => {
                const exp = parseFloat($("inp-exp").value) || 1.0;
                const gain = parseFloat($("inp-gain").value) || 0.0;
                await fetch("/api/camera/mode", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mode: "manual" }) });
                await fetch("/api/camera/exposure", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ exposure_s: exp, gain_db: gain }) });
                $("cam-manual").classList.add("active");
                $("cam-auto").classList.remove("active");
                notify(`Set ${exp}s / ${gain}dB`);
            });

            // LST Clock
            function updateClock() {
                const now = new Date();
                const jd = now.getTime() / 86400000.0 + 2440587.5;
                const d = jd - 2451545.0;
                const t = d / 36525.0;
                const gmst = (280.46061837 + 360.98564736629 * d + 0.000387933 * t * t - (t * t * t) / 38710000.0) % 360.0;
                const lmstDeg = ((gmst + stationLon) % 360.0 + 360.0) % 360.0;
                const totalH = lmstDeg / 15.0;
                const h = Math.floor(totalH);
                const m = Math.floor((totalH - h) * 60.0);
                const s = Math.floor(((totalH - h) * 60.0 - m) * 60.0);
                lblLst.textContent = `LST ${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
            }
            setInterval(updateClock, 1000);
            updateClock();

            // WebSocket for instant sync + live telemetry in Dock
            let ws = null;
            function connectWs() {
                const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
                try {
                    ws = new WebSocket(proto + "//" + window.location.host + "/ws/live?binary=1");
                    ws.binaryType = "arraybuffer";
                    ws.onopen = () => { statusDot.className = "dot online"; };
                    ws.onmessage = (ev) => {
                        if (ev.data instanceof ArrayBuffer && ev.data.byteLength >= 36) {
                            const dv = new DataView(ev.data);
                            if (dv.getUint8(0) === 0x41 && dv.getUint8(1) === 0x53) {
                                const exp = dv.getFloat32(16, true);
                                const gain = dv.getFloat32(20, true);
                                const stars = dv.getUint32(32, true);
                                telemSummary.textContent = `${exp >= 1 ? exp.toFixed(1) + " s" : (exp * 1000).toFixed(0) + " ms"} · ${gain.toFixed(1)} dB · ${stars}★`;
                            }
                        } else if (typeof ev.data === "string") {
                            try {
                                const msg = JSON.parse(ev.data);
                                if (msg.type === "obs_overlay" && msg.settings) syncUI(msg.settings, true);
                            } catch (e) {
                                console.error("[OBS:Dock] Invalid WS JSON:", e);
                            }
                        }
                    };
                    ws.onclose = () => {
                        statusDot.className = "dot offline";
                        setTimeout(connectWs, 3000);
                    };
                } catch (e) {
                    console.error("[OBS:Dock] WS connection error:", e);
                    statusDot.className = "dot offline";
                }
            }

            // Initial data load
            fetch("/api/station/config").then((r) => r.json()).then((c) => {
                if (c && c.longitude_deg) stationLon = c.longitude_deg;
            }).catch((e) => console.error("[OBS:Dock] Config load error:", e));

            fetch("/api/obs/overlay").then((r) => r.json()).then((s) => syncUI(s)).catch((e) => console.error("[OBS:Dock] Overlay load error:", e));

            fetch("/api/camera/star-boost").then((r) => r.json()).then((d) => {
                starBoostOn = !!(d && d.enabled);
                $("cam-boost").classList.toggle("active", starBoostOn);
            }).catch((e) => console.error("[OBS:Dock] Star boost load error:", e));

            async function pollTelemetry() {
                try {
                    const r = await fetch("/api/telemetry");
                    if (r.ok) {
                        const d = await r.json();
                        if (d.mode) {
                            $("cam-auto").classList.toggle("active", d.mode === "auto");
                            $("cam-manual").classList.toggle("active", d.mode !== "auto");
                        }
                        const exp = d.exposure_time_s ?? d.exposure_s ?? 0;
                        const gain = d.gain_db ?? 0;
                        if (document.activeElement !== $("inp-exp") && exp > 0) {
                            $("inp-exp").value = exp < 0.01 ? Number(exp.toFixed(5)) : Number(exp.toFixed(3));
                        }
                        if (document.activeElement !== $("inp-gain")) $("inp-gain").value = Number(gain.toFixed(1));
                        $("cam-sky-info").textContent = `${d.sky_state || d.sky_status || "clear"} • Clouds ${Math.round(d.cloud_cover_pct || 0)}%`;
                    }
                } catch (e) {
                    console.error("[OBS:Dock] Telemetry poll error:", e);
                }
            }
            pollTelemetry();
            setInterval(pollTelemetry, 8000);

            loadEventsOrAdsb();
            setInterval(() => { if (currentTab === "adsb") loadEventsOrAdsb(); }, 5000);
            connectWs();
        })();
    </script>
</body>
</html>
